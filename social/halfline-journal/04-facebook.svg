<text class="b" x="146" y="1076" font-size="19" fill="#6B6B6B">Plate IV. Brannock Field, home of the Calderholm Kestrels, at dusk. Illustration.</text>
<text class="b" x="72" y="1140" font-size="23" fill="#121212">Tell us about the ground that raised</text>
<text class="b" x="72" y="1174" font-size="23" fill="#121212">you: the volunteer who lined the</text>
<text class="b" x="72" y="1208" font-size="23" fill="#121212">pitch, the stand that leaked, the</text>
<text class="b" x="72" y="1242" font-size="23" fill="#121212">night everyone stayed behind.</text>
<line x1="600" y1="1116" x2="600" y2="1252" stroke="#121212" stroke-width="1.5"/>
<text class="b" x="632" y="1140" font-size="23" fill="#121212">We will report five reader stories</text>
<text class="b" x="632" y="1174" font-size="23" fill="#121212">in full for our winter issue, with</text>
<text class="b" x="632" y="1208" font-size="23" fill="#121212">your words first and ours second.</text>
<text class="b" x="632" y="1242" font-size="23" fill="#6B6B6B">A fictional campaign.</text>
<rect x="72" y="1300" width="1056" height="100" fill="#B91C1C"/>
<text class="d" x="112" y="1364" font-size="44" fill="#FFFFFF">Share your ground</text>
<text class="k" x="1088" y="1360" font-size="20" fill="#FFFFFF" text-anchor="end">OPEN UNTIL 31 OCT 2026</text>
<text class="b" x="72" y="1440" font-size="19" fill="#6B6B6B">Submissions via the Sunday Long Read newsletter. Fictional teams and places only.</text>
