  <text class="m" x="120" y="836" font-size="19" font-weight="600" fill="#0A0F1C">~36h · 50%</text>
  <text class="d" x="104" y="912" font-size="30" font-weight="800" fill="#0A0F1C">Quillon Arc Pro</text>
  <text class="m" x="1096" y="912" font-size="18" fill="#4A5168" text-anchor="end">earbuds · Quillon Audio</text>
  <rect x="104" y="930" width="992" height="34" rx="6" fill="#6D28D9"/>
  <text class="m" x="120" y="954" font-size="19" font-weight="600" fill="#FFFFFF">9h · with noise cancelling off</text>
  <rect x="104" y="972" width="714" height="34" rx="6" fill="#10B981"/>
  <text class="m" x="120" y="996" font-size="19" font-weight="600" fill="#0A0F1C">~6.5h · 72%</text>
  <text class="d" x="104" y="1072" font-size="30" font-weight="800" fill="#0A0F1C">Ferrowick Note 14</text>
  <text class="m" x="1096" y="1072" font-size="18" fill="#4A5168" text-anchor="end">laptop · Ferrowick</text>
  <rect x="104" y="1090" width="992" height="20" rx="5" fill="#6D28D9"/>
  <rect x="104" y="1116" width="585" height="20" rx="5" fill="#10B981"/>
  <text class="m" x="1086" y="1105" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="end">22h · video playback, offline</text>
  <text class="m" x="700" y="1132" font-size="15" font-weight="600" fill="#047857">~13h · 59%</text>
  <text class="t" x="64" y="1206" font-size="30" font-weight="700" fill="#FFFFFF">Read the condition first. Then the number.</text>
  <text class="t" x="64" y="1246" font-size="24" fill="#C9CEDC">The full method lands in this week’s Diodeline Daily.</text>
  <text class="m" x="64" y="1286" font-size="18" fill="#9AA3BC">Illustrative sample data for fictional products. Not real test results.</text>
