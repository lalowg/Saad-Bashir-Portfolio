<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="Diodeline LinkedIn post: the battery claim is a condition, not a number">
  <style>@import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&amp;family=Red+Hat+Text:wght@400;500;700&amp;family=Red+Hat+Mono:wght@500;600&amp;display=swap');
  .d{font-family:'Red Hat Display',Arial,Helvetica,sans-serif}.t{font-family:'Red Hat Text',Arial,Helvetica,sans-serif}.m{font-family:'Red Hat Mono','Courier New',monospace}</style>
  <defs>
    <symbol id="mk" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#141B2E"/><line x1="64" y1="256" x2="448" y2="256" stroke="#10B981" stroke-width="22" stroke-linecap="round"/><polygon points="168,128 340,256 168,384" fill="#6D28D9"/><polygon points="196,184 292,256 196,328" fill="#E0E7FF" opacity="0.18"/><rect x="344" y="128" width="32" height="256" rx="8" fill="#10B981"/><circle cx="64" cy="256" r="26" fill="#141B2E" stroke="#10B981" stroke-width="12"/><circle cx="448" cy="256" r="26" fill="#141B2E" stroke="#10B981" stroke-width="12"/></symbol>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#1A2238"/></pattern>
  </defs>
  <rect width="1200" height="1350" fill="#0A0F1C"/>
  <rect width="1200" height="1350" fill="url(#dots)"/>
  <g fill="none" stroke="#1E2640" stroke-width="3"><path d="M1200 180 H1010 L970 220 H900"/><path d="M1200 250 H1060 L1030 280 H980"/></g>
  <circle cx="900" cy="220" r="7" fill="#10B981"/><circle cx="980" cy="280" r="6" fill="#6D28D9"/>
  <use href="#mk" x="64" y="64" width="68" height="68"/>
  <text class="d" x="148" y="112" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">diode<tspan fill="#C4B5FD">line</tspan></text>
  <rect x="854" y="78" width="282" height="42" rx="6" fill="none" stroke="#10B981" stroke-width="2"/>
  <text class="m" x="995" y="106" font-size="20" font-weight="600" fill="#10B981" text-anchor="middle">SPEC-CARD METHOD</text>
  <text class="d" x="62" y="270" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-3">The battery claim</text>
  <text class="d" x="62" y="362" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-3">is a <tspan fill="#C4B5FD">condition</tspan>,</text>
  <text class="d" x="62" y="454" font-size="82" font-weight="900" fill="#10B981" letter-spacing="-3">not a number.</text>
  <text class="t" x="64" y="526" font-size="30" fill="#C9CEDC">Three sample spec sheets, read down to the fine print.</text>
  <rect x="64" y="580" width="1072" height="570" rx="20" fill="#F7F8FA"/>
  <text class="m" x="104" y="636" font-size="20" font-weight="600" fill="#4A5168">MIXED-USE ESTIMATE AS % OF HEADLINE CLAIM</text>
  <g class="m" font-size="18" fill="#4A5168">
    <rect x="104" y="660" width="22" height="16" rx="3" fill="#6D28D9"/><text x="136" y="675">Headline claim</text>
    <rect x="320" y="660" width="22" height="16" rx="3" fill="#10B981"/><text x="352" y="675">Typical mixed use</text>
  </g>
  <line x1="104" y1="700" x2="1096" y2="700" stroke="#D9DDE7" stroke-width="2"/>
  <text class="d" x="104" y="752" font-size="30" font-weight="800" fill="#0A0F1C">Lumen Slate 4</text>
  <text class="m" x="1096" y="752" font-size="18" fill="#4A5168" text-anchor="end">tablet · Corvane Labs</text>
  <rect x="104" y="770" width="992" height="34" rx="6" fill="#6D28D9"/>
  <text class="m" x="120" y="794" font-size="19" font-weight="600" fill="#FFFFFF">72h · only in Calm mode at 40% brightness</text>
