<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Diodeline Facebook community post: Ask the Desk live Q and A">
  <style>@import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&amp;family=Red+Hat+Text:wght@400;500;700&amp;family=Red+Hat+Mono:wght@500;600&amp;display=swap');
  .d{font-family:'Red Hat Display',Arial,Helvetica,sans-serif}.t{font-family:'Red Hat Text',Arial,Helvetica,sans-serif}.m{font-family:'Red Hat Mono','Courier New',monospace}</style>
  <defs>
    <symbol id="mk" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A0F1C"/><line x1="64" y1="256" x2="448" y2="256" stroke="#10B981" stroke-width="22" stroke-linecap="round"/><polygon points="168,128 340,256 168,384" fill="#6D28D9"/><polygon points="196,184 292,256 196,328" fill="#E0E7FF" opacity="0.18"/><rect x="344" y="128" width="32" height="256" rx="8" fill="#10B981"/><circle cx="64" cy="256" r="26" fill="#0A0F1C" stroke="#10B981" stroke-width="12"/><circle cx="448" cy="256" r="26" fill="#0A0F1C" stroke="#10B981" stroke-width="12"/></symbol>
    <pattern id="pdots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#7C3AED"/></pattern>
  </defs>
  <rect width="1200" height="1500" fill="#F7F8FA"/>
  <rect width="1200" height="840" fill="#6D28D9"/>
  <rect width="1200" height="840" fill="url(#pdots)"/>
  <use href="#mk" x="64" y="64" width="68" height="68"/>
  <text class="d" x="148" y="112" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">diode<tspan fill="#0A0F1C">line</tspan></text>
  <rect x="64" y="196" width="388" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text class="m" x="258" y="226" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">SAMPLE EVENT · LIVE Q&amp;A</text>
  <text class="d" x="58" y="380" font-size="124" font-weight="900" fill="#FFFFFF" letter-spacing="-4">Ask the</text>
  <text class="d" x="58" y="500" font-size="124" font-weight="900" fill="#FFFFFF" letter-spacing="-4">Desk<tspan fill="#10B981">.</tspan></text>
  <text class="t" x="64" y="580" font-size="40" font-weight="500" fill="#FFFFFF">No gadget question is</text>
  <text class="t" x="64" y="630" font-size="40" font-weight="500" fill="#FFFFFF">too basic. Bring yours.</text>
  <!-- speech bubble drawn as a circuit trace -->
  <g transform="translate(680,170)">
    <path d="M40 0 H416 A40 40 0 0 1 456 40 V300 A40 40 0 0 1 416 340 H170 L100 410 V340 H40 A40 40 0 0 1 0 300 V40 A40 40 0 0 1 40 0 Z" fill="#0A0F1C"/>
    <path d="M60 30 H180 L200 50 H300" fill="none" stroke="#232B45" stroke-width="4" stroke-linecap="round"/>
    <path d="M396 310 H290 L270 290 H200" fill="none" stroke="#232B45" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="170" x2="400" y2="170" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
    <polygon points="170,92 290,170 170,248" fill="#6D28D9"/>
    <polygon points="190,130 252,170 190,210" fill="#E0E7FF" opacity="0.2"/>
    <rect x="292" y="92" width="18" height="156" rx="5" fill="#10B981"/>
    <circle cx="56" cy="170" r="14" fill="#0A0F1C" stroke="#10B981" stroke-width="6"/>
    <circle cx="400" cy="170" r="14" fill="#0A0F1C" stroke="#10B981" stroke-width="6"/>
    <rect x="300" y="18" width="124" height="34" rx="5" fill="#E0E7FF"/>
    <text class="m" x="362" y="42" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="middle">Q&amp;A v1</text>
  </g>
  <!-- event card overlapping both halves -->
  <rect x="64" y="720" width="1072" height="210" rx="18" fill="#0A0F1C"/>
  <rect x="64" y="720" width="12" height="210" rx="6" fill="#10B981"/>
  <text class="m" x="112" y="790" font-size="30" font-weight="600" fill="#10B981">THU 22 OCT 2026 · 18:00 GMT</text>
  <text class="d" x="112" y="850" font-size="40" font-weight="800" fill="#FFFFFF">Live in the Diodeline community group</text>
  <text class="t" x="112" y="898" font-size="26" fill="#C9CEDC">Two editors, one hour, your questions on phones and updates.</text>
  <text class="m" x="64" y="1006" font-size="22" font-weight="600" fill="#4A5168">QUESTIONS WE LOVE</text>
  <line x1="320" y1="999" x2="1136" y2="999" stroke="#D9DDE7" stroke-width="2"/>
  <g>
    <rect x="64" y="1036" width="336" height="200" rx="14" fill="#FFFFFF" stroke="#D9DDE7" stroke-width="2"/>
    <rect x="88" y="1060" width="52" height="30" rx="4" fill="#E0E7FF"/><text class="m" x="114" y="1081" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="middle">Q1</text>
    <text class="d" x="88" y="1150" font-size="30" font-weight="800" fill="#0A0F1C">Do I need to</text>
    <text class="d" x="88" y="1192" font-size="30" font-weight="800" fill="#0A0F1C">update tonight?</text>
    <rect x="432" y="1052" width="336" height="200" rx="14" fill="#E0E7FF"/>
    <rect x="456" y="1076" width="52" height="30" rx="4" fill="#6D28D9"/><text class="m" x="482" y="1097" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Q2</text>
    <text class="d" x="456" y="1166" font-size="32" font-weight="800" fill="#0A0F1C">What does</text>
    <text class="d" x="456" y="1208" font-size="32" font-weight="800" fill="#6D28D9">“NPU” mean?</text>
    <rect x="800" y="1036" width="336" height="200" rx="14" fill="#0A0F1C"/>
    <rect x="824" y="1060" width="52" height="30" rx="4" fill="#10B981"/><text class="m" x="850" y="1081" font-size="18" font-weight="600" fill="#0A0F1C" text-anchor="middle">Q3</text>
    <text class="d" x="824" y="1150" font-size="32" font-weight="800" fill="#FFFFFF">Is my router</text>
    <text class="d" x="824" y="1192" font-size="32" font-weight="800" fill="#10B981">too old?</text>
  </g>
  <rect x="64" y="1300" width="600" height="84" rx="10" fill="#6D28D9"/>
  <text class="d" x="364" y="1353" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">Drop your question below -&gt;</text>
  <text class="m" x="1136" y="1336" font-size="22" font-weight="500" fill="#0A0F1C" text-anchor="end">Answers posted</text>
