="b" font-size="26" fill="#3A2416">Reach up, roll shoulders, take your time.</text><circle cx="150" cy="716" r="58" fill="#FFC93C" stroke="#3A2416" stroke-width="4"/><text x="150" y="738" text-anchor="middle" class="d" font-size="60" fill="#3A2416">1</text><rect x="80" y="868" width="772" height="132" rx="40" fill="#3A2416"/><rect x="72" y="860" width="772" height="132" rx="40" fill="#FFFDF8" stroke="#3A2416" stroke-width="3"/><text x="108" y="920" class="d" font-size="42" fill="#3A2416">Sip some water</text><text x="108" y="962" class="b" font-size="26" fill="#3A2416">A full glass before the first scroll.</text><circle cx="930" cy="926" r="58" fill="#7FB7A4" stroke="#3A2416" stroke-width="4"/><text x="930" y="948" text-anchor="middle" class="d" font-size="60" fill="#3A2416">2</text><rect x="244" y="1078" width="772" height="132" rx="40" fill="#3A2416"/><rect x="236" y="1070" width="772" height="132" rx="40" fill="#FFFDF8" stroke="#3A2416" stroke-width="3"/><text x="300" y="1130" class="d" font-size="42" fill="#3A2416">Find the light</text><text x="300" y="1172" class="b" font-size="26" fill="#3A2416">Step to a window or doorstep for a minute.</text><circle cx="150" cy="1136" r="58" fill="#FF8A3D" stroke="#3A2416" stroke-width="4"/><text x="150" y="1158" text-anchor="middle" class="d" font-size="60" fill="#3A2416">3</text><rect x="80" y="1288" width="772" height="132" rx="40" fill="#3A2416"/><rect x="72" y="1280" width="772" height="132" rx="40" fill="#FFFDF8" stroke="#3A2416" stroke-width="3"/><text x="108" y="1340" class="d" font-size="42" fill="#3A2416">Breathe slowly</text><text x="108" y="1382" class="b" font-size="26" fill="#3A2416">Five easy breaths, in through the nose.</text><circle cx="930" cy="1346" r="58" fill="#FFC93C" stroke="#3A2416" stroke-width="4"/><text x="930" y="1368" text-anchor="middle" class="d" font-size="60" fill="#3A2416">4</text><rect x="244" y="1498" width="772" height="132" rx="40" fill="#3A2416"/><rect x="236" y="1490" width="772" height="132" rx="40" fill="#FFFDF8" stroke="#3A2416" stroke-width="3"/><text x="300" y="1550" class="d" font-size="42" fill="#3A2416">Eat something bright</text><text x="300" y="1592" class="b" font-size="26" fill="#3A2416">Add one colourful food to breakfast.</text><circle cx="150" cy="1556" r="58" fill="#7FB7A4" stroke="#3A2416" stroke-width="4"/><text x="150" y="1578" text-anchor="middle" class="d" font-size="60" fill="#3A2416">5</text><g><rect x="280" y="1660" width="520" height="67.2" rx="33.6" fill="#3A2416"/><text x="540" y="1704.8" text-anchor="middle" class="bm" font-size="32" fill="#FFF6E9">Save this for tomorrow</text></g><text x="540" y="1770" text-anchor="middle" class="b" font-size="24" fill="#3A2416">General wellness ideas, not medical advice.</text></svg>
