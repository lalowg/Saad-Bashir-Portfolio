<text class="d" x="200" y="910" font-size="34" font-weight="700" fill="#E7E9F5"><tspan x="200" dy="0">Nonce</tspan></text>
<text class="b" x="200" y="950" font-size="26" font-weight="400" fill="#A3A8C3"><tspan x="200" dy="0">The value varied in proof-of-work.</tspan></text>
<line x1="108" y1="976" x2="836" y2="976" stroke="#E7E9F5" stroke-opacity="0.1" stroke-width="1.5"/>
<polygon points="140,998 172,1016 172,1052 140,1070 108,1052 108,1016" fill="none" stroke="#26D0CE" stroke-width="2.5"/>
<text class="b" x="140" y="1043" font-size="22" font-weight="700" fill="#26D0CE" text-anchor="middle"><tspan x="140" dy="0">05</tspan></text>
<text class="d" x="200" y="1030" font-size="34" font-weight="700" fill="#E7E9F5"><tspan x="200" dy="0">Transactions</tspan></text>
<text class="b" x="200" y="1070" font-size="26" font-weight="400" fill="#A3A8C3"><tspan x="200" dy="0">The payload: transfers in this block.</tspan></text>
