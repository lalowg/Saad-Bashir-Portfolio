<text class="d" x="200" y="790" font-size="34" font-weight="700" fill="#E7E9F5"><tspan x="200" dy="0">Merkle root</tspan></text>
<text class="b" x="200" y="830" font-size="26" font-weight="400" fill="#A3A8C3"><tspan x="200" dy="0">One fingerprint for every transaction.</tspan></text>
