<text class="d" x="72" y="318" font-size="76" font-weight="700" fill="#E7E9F5" letter-spacing="-1.5"><tspan x="72" dy="0">Five fields hold</tspan><tspan x="72" dy="90" fill="#B7A6FF">the chain together.</tspan></text>
