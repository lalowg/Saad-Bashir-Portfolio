<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="The Plainwire LinkedIn data explainer: Kestrel Basin transit timetable reset, four weeks in">
  <title>Data explainer: Kestrel Basin timetable reset</title>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Public+Sans:wght@400..800&display=swap');
  .d{font-family:'Newsreader',Georgia,serif}
  .b{font-family:'Public Sans',Arial,Helvetica,sans-serif}]]></style>
  <defs>
    <g id="mk">
      <rect width="512" height="512" rx="96" fill="#1D4ED8"/>
      <path d="M176 140 H286 A80 80 0 0 1 286 300 H176" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <path d="M176 118 V392 H380" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <circle cx="430" cy="392" r="30" fill="#DC2626"/>
      <circle cx="430" cy="392" r="12" fill="#FFFFFF"/>
    </g>
  </defs>
  <rect width="1200" height="1350" fill="#FFFFFF"/>
  <!-- top ink band -->
  <rect width="1200" height="12" fill="#1D4ED8"/>
  <use href="#mk" transform="translate(64 56) scale(0.11)"/>
  <text class="d" x="136" y="98" font-size="36" font-weight="700" fill="#111827">The Plainwire</text>
  <text class="b" x="840" y="94" font-size="20" font-weight="800" fill="#1D4ED8" letter-spacing="2.5" text-anchor="end">DATA EXPLAINER</text>
  <rect x="864" y="62" width="272" height="46" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text class="b" x="1000" y="93" font-size="20" font-weight="800" fill="#DC2626" letter-spacing="2" text-anchor="middle">SAMPLE STORY</text>
  <line x1="64" y1="140" x2="1136" y2="140" stroke="#111827" stroke-width="2"/>
  <!-- headline -->
  <text class="d" font-size="74" font-weight="700" fill="#111827" letter-spacing="-0.8">
    <tspan x="64" y="236">Shorter waits, fewer</tspan>
    <tspan x="64" y="320">late trains? What the</tspan>
    <tspan x="64" y="404" fill="#1D4ED8" font-style="italic">data says so far</tspan>
  </text>
  <text class="b" x="64" y="472" font-size="30" fill="#374151">Kestrel Basin Transit’s new timetable, four weeks in.</text>
  <!-- chart panel -->
  <rect x="64" y="520" width="1072" height="500" fill="#F3F4F6"/>
  <text class="b" x="104" y="580" font-size="22" font-weight="800" fill="#111827" letter-spacing="2">AVERAGE PEAK WAIT, MINUTES</text>
  <g class="b" font-size="20" font-weight="700">
    <rect x="760" y="560" width="22" height="22" fill="#9CA3AF"/><text x="792" y="578" fill="#111827">Before</text>
    <rect x="890" y="560" width="22" height="22" fill="#1D4ED8"/><text x="922" y="578" fill="#111827">After 4 weeks</text>
  </g>
  <!-- gridlines: scale 34px per minute from x=280 -->
  <g stroke="#D1D5DB" stroke-width="1">
    <line x1="280" y1="610" x2="280" y2="960"/><line x1="450" y1="610" x2="450" y2="960"/><line x1="620" y1="610" x2="620" y2="960"/><line x1="790" y1="610" x2="790" y2="960"/>
  </g>
  <g class="b" font-size="18" fill="#4B5563" text-anchor="middle"><text x="280" y="990">0</text><text x="450" y="990">5</text><text x="620" y="990">10</text><text x="790" y="990">15</text></g>
  <g class="b">
    <text x="104" y="652" font-size="26" font-weight="800" fill="#111827">Line A</text>
    <rect x="280" y="626" width="408" height="22" fill="#9CA3AF"/><text x="700" y="645" font-size="20" fill="#4B5563">12</text>
    <rect x="280" y="652" width="306" height="22" fill="#1D4ED8"/><text x="598" y="671" font-size="20" font-weight="800" fill="#1D4ED8">9</text>
    <text x="104" y="737" font-size="26" font-weight="800" fill="#111827">Line B</text>
    <rect x="280" y="711" width="510" height="22" fill="#9CA3AF"/><text x="802" y="730" font-size="20" fill="#4B5563">15</text>
    <rect x="280" y="737" width="374" height="22" fill="#1D4ED8"/><text x="666" y="756" font-size="20" font-weight="800" fill="#1D4ED8">11</text>
    <text x="104" y="822" font-size="26" font-weight="800" fill="#111827">Line C</text>
    <rect x="280" y="796" width="340" height="22" fill="#9CA3AF"/><text x="632" y="815" font-size="20" fill="#4B5563">10</text>
    <rect x="280" y="822" width="340" height="22" fill="#1D4ED8"/><text x="632" y="841" font-size="20" font-weight="800" fill="#1D4ED8">10</text>
    <text x="104" y="907" font-size="26" font-weight="800" fill="#111827">Line D</text>
    <rect x="280" y="881" width="612" height="22" fill="#9CA3AF"/><text x="904" y="900" font-size="20" fill="#4B5563">18</text>
    <rect x="280" y="907" width="442" height="22" fill="#1D4ED8"/><text x="734" y="926" font-size="20" font-weight="800" fill="#1D4ED8">13</text>
  </g>
  <!-- callout -->
  <g transform="translate(940 640)">
    <rect width="160" height="150" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <text class="d" x="80" y="72" font-size="56" font-weight="800" fill="#DC2626" text-anchor="middle">−23%</text>
    <text class="b" x="80" y="104" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">avg. wait,</text>
    <text class="b" x="80" y="128" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">lines A–D</text>
  </g>
  <!-- timeline strip -->
  <text class="b" x="64" y="1084" font-size="22" font-weight="800" fill="#1D4ED8" letter-spacing="2.5">TIMELINE</text>
  <line x1="64" y1="1116" x2="1136" y2="1116" stroke="#111827" stroke-width="4"/>
  <g class="b">
    <circle cx="80" cy="1116" r="12" fill="#1D4ED8"/>
    <text x="64" y="1160" font-size="22" font-weight="800" fill="#111827">Sep 28</text><text x="64" y="1190" font-size="20" fill="#4B5563">Timetable starts</text>
    <circle cx="348" cy="1116" r="12" fill="#1D4ED8"/>
    <text x="332" y="1160" font-size="22" font-weight="800" fill="#111827">Oct 5</text><text x="332" y="1190" font-size="20" fill="#4B5563">Rider survey opens</text>
    <circle cx="616" cy="1116" r="14" fill="#DC2626"/><circle cx="616" cy="1116" r="5" fill="#FFFFFF"/>
    <text x="600" y="1160" font-size="22" font-weight="800" fill="#DC2626">Oct 26</text><text x="600" y="1190" font-size="20" fill="#4B5563">Data review (today)</text>
    <circle cx="884" cy="1116" r="12" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    <text x="868" y="1160" font-size="22" font-weight="800" fill="#111827">Nov 9</text><text x="868" y="1190" font-size="20" fill="#4B5563">Board hearing</text>
  </g>
  <!-- footer -->
  <line x1="64" y1="1238" x2="1136" y2="1238" stroke="#E5E7EB" stroke-width="2"/>
  <text class="b" x="64" y="1290" font-size="28" font-weight="800" fill="#1D4ED8">Read the full explainer →</text>
  <text class="b" x="1136" y="1278" font-size="18" fill="#4B5563" text-anchor="end">Figures are illustrative. Kestrel Basin is fictional.</text>
  <text class="b" x="1136" y="1302" font-size="18" fill="#4B5563" text-anchor="end">Sample story · Oct 26, 2026</text>
</svg>
