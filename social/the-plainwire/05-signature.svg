<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="The Plainwire Instagram Story: Tamsford overnight outage, what we know and what we don't know yet">
  <title>Signature story: What we know / What we don't know yet</title>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Public+Sans:wght@400..800&display=swap');
  .d{font-family:'Newsreader',Georgia,serif}
  .b{font-family:'Public Sans',Arial,Helvetica,sans-serif}]]></style>
  <defs>
    <g id="mk">
      <rect width="512" height="512" rx="96" fill="#1D4ED8"/>
      <path d="M176 140 H286 A80 80 0 0 1 286 300 H176" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <path d="M176 118 V392 H380" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round"/>
      <circle cx="430" cy="392" r="30" fill="#DC2626"/>
      <circle cx="430" cy="392" r="12" fill="#FFFFFF"/>
    </g>
    <g id="tick"><circle r="18" fill="#1D4ED8"/><path d="M-8 0 L-2 7 L9 -7" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="q"><circle r="18" fill="none" stroke="#DC2626" stroke-width="4"/><circle r="5" fill="#DC2626"/></g>
  </defs>
  <rect width="1080" height="1920" fill="#FFFFFF"/>
  <!-- header (kept below story UI zone) -->
  <use href="#mk" transform="translate(64 150) scale(0.11)"/>
  <text class="d" x="136" y="192" font-size="36" font-weight="700" fill="#111827">The Plainwire</text>
  <rect x="808" y="154" width="208" height="46" fill="#DC2626"/>
  <text class="b" x="912" y="185" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">SAMPLE STORY</text>
  <line x1="64" y1="248" x2="1016" y2="248" stroke="#111827" stroke-width="3"/>
  <text class="b" x="64" y="300" font-size="24" font-weight="700" fill="#4B5563">Updated Oct 12, 2026 · 09:40 · Tamsford (fictional)</text>
  <!-- headline -->
  <text class="d" font-size="88" font-weight="700" fill="#111827" letter-spacing="-1">
    <tspan x="64" y="410">Tamsford’s</tspan>
    <tspan x="64" y="506">overnight outage:</tspan>
    <tspan x="64" y="602" fill="#1D4ED8" font-style="italic">the facts so far</tspan>
  </text>
  <!-- WHAT WE KNOW -->
  <rect x="64" y="672" width="952" height="72" fill="#1D4ED8"/>
  <text class="b" x="100" y="720" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="3">WHAT WE KNOW</text>
  <text class="b" x="980" y="720" font-size="22" font-weight="700" fill="#BFDBFE" text-anchor="end">Confirmed by 2 sources</text>
  <rect x="64" y="744" width="952" height="400" fill="#F3F4F6"/>
  <g class="b" font-size="32" fill="#111827">
    <use href="#tick" transform="translate(116 812)"/><text x="156" y="823">About 4,200 homes lost power at 01:15</text>
    <use href="#tick" transform="translate(116 900)"/><text x="156" y="911">Crews restored 80% by 07:00</text>
    <use href="#tick" transform="translate(116 988)"/><text x="156" y="999">Utility points to a failed substation relay</text>
    <use href="#tick" transform="translate(116 1076)"/><text x="156" y="1087">Schools in two districts open late</text>
  </g>
  <!-- WHAT WE DON'T KNOW -->
  <rect x="64" y="1184" width="952" height="72" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>
  <text class="b" x="100" y="1232" font-size="28" font-weight="800" fill="#DC2626" letter-spacing="3">WHAT WE DON’T KNOW YET</text>
  <g class="b" font-size="32" fill="#111827">
    <use href="#q" transform="translate(116 1320)"/><text x="156" y="1331">When the last 20% will reconnect</text>
    <use href="#q" transform="translate(116 1404)"/><text x="156" y="1415">Whether the fault is storm-related</text>
    <use href="#q" transform="translate(116 1488)"/><text x="156" y="1499">How many businesses were affected</text>
  </g>
  <!-- timeline strip -->
  <line x1="64" y1="1588" x2="1016" y2="1588" stroke="#111827" stroke-width="4"/>
  <g class="b">
    <circle cx="80" cy="1588" r="12" fill="#111827"/><text x="64" y="1632" font-size="24" font-weight="800" fill="#111827">01:15</text><text x="64" y="1662" font-size="20" fill="#4B5563">Outage begins</text>
    <circle cx="324" cy="1588" r="12" fill="#111827"/><text x="308" y="1632" font-size="24" font-weight="800" fill="#111827">03:30</text><text x="308" y="1662" font-size="20" fill="#4B5563">Crews on site</text>
    <circle cx="568" cy="1588" r="12" fill="#1D4ED8"/><text x="552" y="1632" font-size="24" font-weight="800" fill="#1D4ED8">07:00</text><text x="552" y="1662" font-size="20" fill="#4B5563">80% restored</text>
    <circle cx="812" cy="1588" r="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/><text x="796" y="1632" font-size="24" font-weight="800" fill="#DC2626">12:00</text><text x="796" y="1662" font-size="20" fill="#4B5563">Next update</text>
  </g>
  <!-- CTA (above story reply zone) -->
  <text class="b" x="540" y="1716" font-size="30" font-weight="800" fill="#1D4ED8" text-anchor="middle">Tap for the full explainer →</text>
