<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Paintcourt Instagram Story infographic: Anatomy of a grail, a fictional retro sneaker taken apart">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Grotesk:wght@400;500;700&display=swap');
    .d{font-family:'Rubik Mono One',Impact,'Arial Black',sans-serif}
    .b{font-family:'Space Grotesk',Arial,Helvetica,sans-serif}
  ]]></style>
  <defs>
    <pattern id="dotsO" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#E85D04"/></pattern>
    <pattern id="dotsP" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3" fill="#5A189A"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0" result="n"/>
      <feComponentTransfer><feFuncR type="table" tableValues="1 1"/><feFuncG type="table" tableValues="1 1"/><feFuncB type="table" tableValues="1 1"/><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <g id="mark">
      <rect width="512" height="512" rx="104" fill="#5A189A"/>
      <rect x="148" y="262" width="216" height="250" fill="#E85D04"/>
      <path d="M148 512 V262 H364 V512" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M148 262 A108 108 0 0 1 364 262" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M364 262 A108 108 0 0 1 148 262" fill="none" stroke="#F3E9DC" stroke-width="10" stroke-dasharray="22 18"/>
      <g transform="rotate(-14 380 132)">
        <circle cx="380" cy="132" r="62" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="10"/>
        <path d="M318 132 H442 M380 70 V194 M336 88 C362 112 362 152 336 176 M424 88 C398 112 398 152 424 176" stroke="#1C1C1C" stroke-width="8" fill="none"/>
      </g>
    </g>
    <g id="shoe" stroke="#1C1C1C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 64 C16 48 18 36 30 32 L62 26 C70 14 86 10 100 16 L112 24 C128 34 150 40 172 44 C188 47 196 54 196 64 Z"/>
      <path d="M150 40 C170 43 194 50 196 64 L150 64 Z" fill="#F3E9DC"/>
      <path d="M18 64 C16 48 18 36 30 32 L52 28 L44 64 Z" fill="#F3E9DC"/>
      <path d="M10 64 H200 C202 70 200 78 194 80 H18 C11 80 8 72 10 64 Z" fill="#F3E9DC"/>
      <path d="M16 72 L34 68 L52 72 L70 68 L88 72 L106 68 L124 72 L142 68 L160 72 L178 68 L194 72" fill="none" stroke-width="2.5"/>
      <path d="M70 26 L80 40 M82 20 L92 34 M94 20 L104 33" fill="none"/>
      <path d="M56 54 H146" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle cx="34" cy="46" r="6" fill="#E85D04"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="#1C1C1C"/>
  <rect x="0" y="0" width="1080" height="200" fill="url(#dotsO)" opacity="0.5"/>
  <rect x="0" y="1760" width="1080" height="160" fill="url(#dotsO)" opacity="0.5"/>

  <!-- header -->
  <use xlink:href="#mark" transform="translate(64 250) scale(0.140625)"/>
  <text class="d" x="150" y="300" font-size="30" fill="#F3E9DC">PAINTCOURT</text>
  <g transform="rotate(6 872 286)">
    <rect x="720" y="258" width="304" height="56" fill="#2EC4B6"/>
    <text class="b" x="872" y="295" font-size="21" font-weight="700" letter-spacing="3" fill="#1C1C1C" text-anchor="middle">SNEAKER LAB · 03</text>
  </g>

  <!-- headline -->
  <text class="d" font-size="88" fill="#F3E9DC">
    <tspan x="64" y="436">ANATOMY</tspan>
    <tspan x="64" y="536">OF A</tspan>
  </text>
  <rect x="54" y="562" width="520" height="104" fill="#E85D04" transform="rotate(-3 314 614)"/>
  <text class="d" x="72" y="648" font-size="88" fill="#1C1C1C">GRAIL</text>
  <text class="b" font-size="32" font-weight="500" fill="#F3E9DC">
    <tspan x="64" y="730">Loftline Halo ’96: a fictional retro</tspan>
    <tspan x="64" y="772">hi-top, taken apart piece by piece.</tspan>
  </text>

  <!-- shoe stage -->
  <circle cx="540" cy="1080" r="300" fill="#F3E9DC"/>
  <circle cx="540" cy="1080" r="300" fill="url(#dotsP)" opacity="0.25"/>
  <path d="M240 1080 A300 300 0 0 1 840 1080" fill="none" stroke="#1C1C1C" stroke-width="4" stroke-dasharray="12 10"/>
  <use xlink:href="#shoe" fill="#E85D04" transform="translate(100 880) scale(4.4)"/>

  <!-- callouts -->
  <g stroke="#2EC4B6" stroke-width="4" fill="none">
    <path d="M870 1100 L960 960"/>
    <path d="M440 990 L400 830"/>
    <path d="M250 1082 L120 940"/>
    <path d="M628 1200 L700 1300"/>
  </g>
  <g class="d" font-size="24" text-anchor="middle" fill="#1C1C1C">
    <circle cx="960" cy="960" r="30" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/><text x="960" y="970">1</text>
    <circle cx="400" cy="830" r="30" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/><text x="400" y="840">2</text>
    <circle cx="120" cy="940" r="30" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/><text x="120" y="950">3</text>
    <circle cx="700" cy="1300" r="30" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/><text x="700" y="1310">4</text>
  </g>

  <!-- legend -->
  <text class="d" x="64" y="1466" font-size="24" fill="#2EC4B6">1 TOE CAP</text>
  <text class="b" x="64" y="1500" font-size="26" font-weight="500" fill="#F3E9DC">Cream suede for blacktop scuffs</text>
  <text class="d" x="64" y="1550" font-size="24" fill="#2EC4B6">2 LACE LADDER</text>
  <text class="b" x="64" y="1584" font-size="26" font-weight="500" fill="#F3E9DC">Seven eyelets, laced bar-style</text>
  <text class="d" x="64" y="1634" font-size="24" fill="#2EC4B6">3 HEEL DOT</text>
  <text class="b" x="64" y="1668" font-size="26" font-weight="500" fill="#F3E9DC">The orange dot nods to the court key</text>

  <g transform="rotate(-4 830 1552)">
    <rect x="660" y="1462" width="340" height="180" fill="#5A189A" stroke="#F3E9DC" stroke-width="4"/>
    <text class="d" x="830" y="1520" font-size="22" fill="#F3E9DC" text-anchor="middle">4 ZIGZAG</text>
    <text class="b" font-size="22" font-weight="500" fill="#F3E9DC" text-anchor="middle">
      <tspan x="830" y="1558">Riso-print sidewall,</tspan>
      <tspan x="830" y="1588">no two pairs alike</tspan>
    </text>
    <text class="b" x="830" y="1622" font-size="16" font-weight="700" letter-spacing="2" fill="#2EC4B6" text-anchor="middle">FICTIONAL SNEAKER</text>
  </g>

  <rect x="64" y="1420" width="560" height="4" fill="#F3E9DC"/>
  <text class="b" x="64" y="1404" font-size="18" font-weight="700" letter-spacing="3" fill="#F3E9DC">TAP THROUGH FOR ISSUE 07 →</text>

  <rect width="1080" height="1920" filter="url(#grain)"/>
</svg>
