<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="Paintcourt LinkedIn data post: The corner three ate the league, with an illustrative shot chart">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Grotesk:wght@400;500;700&display=swap');
    .d{font-family:'Rubik Mono One',Impact,'Arial Black',sans-serif}
    .b{font-family:'Space Grotesk',Arial,Helvetica,sans-serif}
  ]]></style>
  <defs>
    <pattern id="dotsT" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2" fill="#1C1C1C"/></pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="14" fill="#F3E9DC" opacity="0.28"/></pattern>
    <pattern id="dotsO" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.5" fill="#E85D04"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer>
    </filter>
    <g id="mark">
      <rect width="512" height="512" rx="104" fill="#5A189A"/>
      <rect x="148" y="262" width="216" height="250" fill="#E85D04"/>
      <path d="M148 512 V262 H364 V512" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M148 262 A108 108 0 0 1 364 262" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M364 262 A108 108 0 0 1 148 262" fill="none" stroke="#F3E9DC" stroke-width="10" stroke-dasharray="22 18"/>
      <g transform="rotate(-14 380 132)">
        <circle cx="380" cy="132" r="62" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="10"/>
        <path d="M318 132 H442 M380 70 V194 M336 88 C362 112 362 152 336 176 M424 88 C398 112 398 152 424 176" stroke="#1C1C1C" stroke-width="8" fill="none"/>
      </g>
    </g>
    <clipPath id="arcIn"><path d="M248 632 V859 A380 380 0 0 0 952 859 V632 Z"/></clipPath>
  </defs>

  <rect width="1200" height="1350" fill="#F3E9DC"/>
  <rect x="760" y="0" width="440" height="560" fill="url(#dotsO)" opacity="0.4"/>

  <!-- header -->
  <use xlink:href="#mark" transform="translate(64 64) scale(0.15625)"/>
  <text class="d" x="158" y="114" font-size="30" fill="#1C1C1C">PAINTCOURT</text>
  <g transform="rotate(-3 600 102)">
    <rect x="508" y="80" width="236" height="44" fill="#1C1C1C"/>
    <text class="b" x="626" y="110" font-size="19" font-weight="700" letter-spacing="3" fill="#F3E9DC" text-anchor="middle">DATA ZINE #07</text>
  </g>

  <!-- headline -->
  <text class="d" font-size="72" fill="#1C1C1C">
    <tspan x="64" y="256">THE CORNER</tspan>
    <tspan x="64" y="346">THREE ATE</tspan>
    <tspan x="64" y="436">THE LEAGUE</tspan>
  </text>
  <rect x="64" y="452" width="420" height="14" fill="#E85D04"/>

  <!-- stat sticker -->
  <g transform="rotate(8 976 330)">
    <circle cx="976" cy="330" r="156" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="6"/>
    <circle cx="976" cy="330" r="138" fill="none" stroke="#1C1C1C" stroke-width="2" stroke-dasharray="6 6"/>
    <text class="d" x="976" y="320" font-size="70" fill="#1C1C1C" text-anchor="middle">×2.4</text>
    <text class="b" font-size="21" font-weight="700" fill="#1C1C1C" text-anchor="middle">
      <tspan x="976" y="364">corner-three attempts</tspan>
      <tspan x="976" y="392">per game, 2016 → 2026</tspan>
    </text>
  </g>

  <text class="b" font-size="28" font-weight="500" fill="#1C1C1C">
    <tspan x="64" y="518">Sample data from a fictional league: offenses are trading</tspan>
    <tspan x="64" y="556">mid-range jumpers for the shortest three on the floor.</tspan>
  </text>

  <!-- panel -->
  <rect x="64" y="600" width="1072" height="530" fill="#5A189A"/>
  <text class="b" x="88" y="626" font-size="17" font-weight="700" letter-spacing="2.5" fill="#F3E9DC">SHARE OF SHOT ATTEMPTS · METRO LEAGUE (FICTIONAL) · 2026</text>

  <!-- zones -->
  <rect x="472" y="640" width="256" height="296" fill="#E85D04"/>
  <rect x="200" y="640" width="48" height="219" fill="#2EC4B6"/>
  <rect x="952" y="640" width="48" height="219" fill="#2EC4B6"/>
  <rect x="200" y="640" width="48" height="219" fill="url(#dotsT)" opacity="0.3"/>
  <rect x="952" y="640" width="48" height="219" fill="url(#dotsT)" opacity="0.3"/>
  <g clip-path="url(#arcIn)">
    <rect x="200" y="640" width="800" height="480" fill="url(#hatch)"/>
    <rect x="472" y="640" width="256" height="296" fill="#E85D04"/>
  </g>
  <!-- lines -->
  <g fill="none" stroke="#F3E9DC" stroke-width="5">
    <path d="M200 640 H1000"/>
    <path d="M200 640 V1120 M1000 640 V1120"/>
    <path d="M248 640 V859 A380 380 0 0 0 952 859 V640"/>
    <rect x="472" y="640" width="256" height="296"/>
    <path d="M504 936 A96 96 0 0 0 696 936" stroke-dasharray="14 10"/>
    <path d="M504 936 A96 96 0 0 1 696 936"/>
    <path d="M552 700 H648"/>
  </g>
  <circle cx="600" cy="718" r="13" fill="none" stroke="#1C1C1C" stroke-width="5"/>

  <!-- zone labels -->
  <text class="d" x="600" y="830" font-size="40" fill="#1C1C1C" text-anchor="middle">34%</text>
  <text class="b" x="600" y="862" font-size="18" font-weight="700" letter-spacing="2" fill="#1C1C1C" text-anchor="middle">PAINT</text>
  <rect x="292" y="844" width="136" height="76" fill="#5A189A"/>
  <text class="d" x="360" y="880" font-size="34" fill="#F3E9DC" text-anchor="middle">15%</text>
  <text class="b" x="360" y="908" font-size="17" font-weight="700" letter-spacing="2" fill="#F3E9DC" text-anchor="middle">MID-RANGE</text>
  <text class="d" x="360" y="1060" font-size="34" fill="#F3E9DC" text-anchor="end">30%</text>
  <text class="b" x="360" y="1088" font-size="17" font-weight="700" letter-spacing="2" fill="#F3E9DC" text-anchor="end">ABOVE BREAK</text>

  <g transform="rotate(-6 156 760)">
    <rect x="76" y="720" width="168" height="84" fill="#F3E9DC" stroke="#1C1C1C" stroke-width="4"/>
    <text class="d" x="160" y="764" font-size="32" fill="#1C1C1C" text-anchor="middle">21%</text>
    <text class="b" x="160" y="792" font-size="16" font-weight="700" letter-spacing="2" fill="#1C1C1C" text-anchor="middle">CORNER 3s</text>
  </g>
  <path d="M244 762 L276 754" stroke="#F3E9DC" stroke-width="4"/>

  <!-- legend -->
  <rect x="1024" y="920" width="24" height="24" fill="#E85D04" stroke="#F3E9DC" stroke-width="2"/>
  <text class="b" x="1056" y="940" font-size="16" font-weight="500" fill="#F3E9DC">Paint</text>
  <rect x="1024" y="956" width="24" height="24" fill="#2EC4B6" stroke="#F3E9DC" stroke-width="2"/>
  <text class="b" x="1056" y="976" font-size="16" font-weight="500" fill="#F3E9DC">Corner</text>
  <rect x="1024" y="992" width="24" height="24" fill="url(#hatch)" stroke="#F3E9DC" stroke-width="2"/>
  <text class="b" x="1056" y="1012" font-size="16" font-weight="500" fill="#F3E9DC">Mid</text>
  <rect x="1024" y="1028" width="24" height="24" fill="#5A189A" stroke="#F3E9DC" stroke-width="2"/>
  <text class="b" x="1056" y="1048" font-size="16" font-weight="500" fill="#F3E9DC">Break</text>

  <!-- footer -->
  <g transform="rotate(-2 230 1206)">
    <rect x="64" y="1172" width="372" height="68" fill="#E85D04" stroke="#1C1C1C" stroke-width="4"/>
    <text class="d" x="250" y="1217" font-size="22" fill="#1C1C1C" text-anchor="middle">READ ISSUE 07 →</text>
  </g>
  <text class="b" font-size="20" font-weight="500" fill="#1C1C1C">
    <tspan x="484" y="1196">Illustrative sample data. Fictional league, teams</tspan>
    <tspan x="484" y="1224">and players. Not real statistics.</tspan>
  </text>
  <text class="b" x="64" y="1290" font-size="18" font-weight="700" letter-spacing="2" fill="#5A189A">#PAINTCOURT · COURTSIDE CULTURE, BY THE NUMBERS</text>

  <rect width="1200" height="1350" filter="url(#grain)"/>
</svg>
