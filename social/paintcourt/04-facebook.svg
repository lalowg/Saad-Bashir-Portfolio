<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Paintcourt Facebook community campaign: Paint the Park court repaint day">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Grotesk:wght@400;500;700&display=swap');
    .d{font-family:'Rubik Mono One',Impact,'Arial Black',sans-serif}
    .b{font-family:'Space Grotesk',Arial,Helvetica,sans-serif}
  ]]></style>
  <defs>
    <pattern id="dotsC" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.6" fill="#F3E9DC"/></pattern>
    <pattern id="dotsI" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1C1C1C"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.15"/></feComponentTransfer>
    </filter>
    <g id="mark">
      <rect width="512" height="512" rx="104" fill="#5A189A"/>
      <rect x="148" y="262" width="216" height="250" fill="#E85D04"/>
      <path d="M148 512 V262 H364 V512" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M148 262 A108 108 0 0 1 364 262" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M364 262 A108 108 0 0 1 148 262" fill="none" stroke="#F3E9DC" stroke-width="10" stroke-dasharray="22 18"/>
      <g transform="rotate(-14 380 132)">
        <circle cx="380" cy="132" r="62" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="10"/>
        <path d="M318 132 H442 M380 70 V194 M336 88 C362 112 362 152 336 176 M424 88 C398 112 398 152 424 176" stroke="#1C1C1C" stroke-width="8" fill="none"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="1500" fill="#F3E9DC"/>
  <rect width="1200" height="780" fill="#5A189A"/>
  <rect y="0" width="1200" height="780" fill="url(#dotsC)" opacity="0.12"/>

  <!-- court, top down -->
  <g transform="rotate(-10 600 440)">
    <rect x="200" y="210" width="800" height="460" fill="#E85D04" opacity="0.18"/>
    <rect x="600" y="210" width="400" height="460" fill="#2EC4B6"/>
    <rect x="600" y="210" width="400" height="460" fill="url(#dotsI)" opacity="0.18"/>
    <rect x="200" y="360" width="170" height="160" fill="#E85D04"/>
    <rect x="830" y="360" width="170" height="160" fill="#5A189A"/>
    <g fill="none" stroke="#F3E9DC" stroke-width="7">
      <rect x="200" y="210" width="800" height="460"/>
      <path d="M600 210 V670"/>
      <circle cx="600" cy="440" r="70"/>
      <rect x="200" y="360" width="170" height="160"/>
      <rect x="830" y="360" width="170" height="160"/>
      <path d="M370 380 A60 60 0 0 1 370 500"/>
      <path d="M830 380 A60 60 0 0 0 830 500"/>
      <path d="M200 240 H260 A200 200 0 0 1 260 640 H200"/>
      <path d="M1000 240 H940 A200 200 0 0 0 940 640 H1000"/>
    </g>
    <circle cx="232" cy="440" r="12" fill="none" stroke="#1C1C1C" stroke-width="5"/>
    <circle cx="968" cy="440" r="12" fill="none" stroke="#1C1C1C" stroke-width="5"/>
    <!-- roller stripe -->
    <rect x="600" y="600" width="400" height="70" fill="#F3E9DC" opacity="0.9"/>
    <text class="d" x="800" y="648" font-size="28" fill="#1C1C1C" text-anchor="middle">WET PAINT</text>
  </g>

  <!-- paint roller -->
  <g transform="rotate(-24 980 532)">
    <rect x="880" y="500" width="200" height="64" rx="18" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="6"/>
    <path d="M1080 532 H1104 V600 H980 V640" fill="none" stroke="#1C1C1C" stroke-width="10" stroke-linejoin="round"/>
    <rect x="964" y="632" width="32" height="90" rx="12" fill="#1C1C1C"/>
  </g>

  <!-- header -->
  <use xlink:href="#mark" transform="translate(64 64) scale(0.140625)"/>
  <text class="d" x="150" y="114" font-size="30" fill="#F3E9DC">PAINTCOURT</text>
  <g transform="rotate(4 978 100)">
    <rect x="820" y="72" width="316" height="58" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/>
    <text class="b" x="978" y="110" font-size="24" font-weight="700" letter-spacing="3" fill="#1C1C1C" text-anchor="middle">SAMPLE EVENT</text>
  </g>

  <!-- starburst -->
  <g transform="translate(1010 820) rotate(-12)">
    <polygon points="0.0,-120.0 19.5,-98.1 45.9,-110.9 55.6,-83.1 84.9,-84.9 83.1,-55.6 110.9,-45.9 98.1,-19.5 120.0,0.0 98.1,19.5 110.9,45.9 83.1,55.6 84.9,84.9 55.6,83.1 45.9,110.9 19.5,98.1 0.0,120.0 -19.5,98.1 -45.9,110.9 -55.6,83.1 -84.9,84.9 -83.1,55.6 -110.9,45.9 -98.1,19.5 -120.0,0.0 -98.1,-19.5 -110.9,-45.9 -83.1,-55.6 -84.9,-84.9 -55.6,-83.1 -45.9,-110.9 -19.5,-98.1" fill="#E85D04" stroke="#1C1C1C" stroke-width="5"/>
    <text class="d" x="0" y="-8" font-size="34" fill="#1C1C1C" text-anchor="middle">FREE</text>
    <text class="b" x="0" y="28" font-size="20" font-weight="700" letter-spacing="2" fill="#1C1C1C" text-anchor="middle">ALL AGES</text>
  </g>

  <!-- headline -->
  <text class="d" x="64" y="912" font-size="120" fill="#1C1C1C">PAINT</text>
  <rect x="52" y="940" width="860" height="132" fill="#E85D04" transform="rotate(-2 482 1006)"/>
  <text class="d" x="64" y="1050" font-size="120" fill="#1C1C1C">THE PARK</text>

  <!-- details -->
  <rect x="64" y="1100" width="1072" height="200" fill="none" stroke="#1C1C1C" stroke-width="4" stroke-dasharray="14 8"/>
  <text class="d" x="96" y="1152" font-size="22" fill="#5A189A">WHEN</text>
  <text class="b" x="300" y="1153" font-size="30" font-weight="500" fill="#1C1C1C">Sat, Oct 24, 2026 · 9am–1pm</text>
  <text class="d" x="96" y="1212" font-size="22" fill="#5A189A">WHERE</text>
  <text class="b" x="300" y="1213" font-size="30" font-weight="500" fill="#1C1C1C">Ridgeway Park, Court 3 (fictional)</text>
  <text class="d" x="96" y="1272" font-size="22" fill="#5A189A">BRING</text>
  <text class="b" x="300" y="1273" font-size="30" font-weight="500" fill="#1C1C1C">An old tee, water and your whole crew</text>

  <!-- CTA -->
  <rect x="64" y="1336" width="620" height="76" fill="#1C1C1C"/>
  <rect x="56" y="1328" width="620" height="76" fill="#E85D04" stroke="#1C1C1C" stroke-width="4"/>
  <text class="b" x="366" y="1376" font-size="24" font-weight="700" letter-spacing="2" fill="#1C1C1C" text-anchor="middle">RSVP IN THE PAINTCOURT GROUP →</text>
  <text class="b" font-size="19" font-weight="500" fill="#1C1C1C" text-anchor="end">
    <tspan x="1136" y="1358">Fictional community event,</tspan>
    <tspan x="1136" y="1386">designed for a portfolio.</tspan>
  </text>

  <rect width="1200" height="1500" filter="url(#grain)"/>
</svg>
