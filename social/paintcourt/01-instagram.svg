<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Paintcourt Instagram carousel cover: Who owns the paint?">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Grotesk:wght@400;500;700&display=swap');
    .d{font-family:'Rubik Mono One',Impact,'Arial Black',sans-serif}
    .b{font-family:'Space Grotesk',Arial,Helvetica,sans-serif}
  ]]></style>
  <defs>
    <pattern id="dotsP" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3.2" fill="#5A189A"/></pattern>
    <pattern id="dotsI" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#1C1C1C"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
    <g id="mark">
      <rect width="512" height="512" rx="104" fill="#5A189A"/>
      <rect x="148" y="262" width="216" height="250" fill="#E85D04"/>
      <path d="M148 512 V262 H364 V512" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M148 262 A108 108 0 0 1 364 262" fill="none" stroke="#F3E9DC" stroke-width="18"/>
      <path d="M364 262 A108 108 0 0 1 148 262" fill="none" stroke="#F3E9DC" stroke-width="10" stroke-dasharray="22 18"/>
      <g transform="rotate(-14 380 132)">
        <circle cx="380" cy="132" r="62" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="10"/>
        <path d="M318 132 H442 M380 70 V194 M336 88 C362 112 362 152 336 176 M424 88 C398 112 398 152 424 176" stroke="#1C1C1C" stroke-width="8" fill="none"/>
      </g>
    </g>
    <g id="shoe" stroke="#1C1C1C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M18 64 C16 48 18 36 30 32 L62 26 C70 14 86 10 100 16 L112 24 C128 34 150 40 172 44 C188 47 196 54 196 64 Z"/>
      <path d="M150 40 C170 43 194 50 196 64 L150 64 Z" fill="#F3E9DC"/>
      <path d="M18 64 C16 48 18 36 30 32 L52 28 L44 64 Z" fill="#F3E9DC"/>
      <path d="M10 64 H200 C202 70 200 78 194 80 H18 C11 80 8 72 10 64 Z" fill="#F3E9DC"/>
      <path d="M16 72 L34 68 L52 72 L70 68 L88 72 L106 68 L124 72 L142 68 L160 72 L178 68 L194 72" fill="none" stroke-width="2.5"/>
      <path d="M70 26 L80 40 M82 20 L92 34 M94 20 L104 33" fill="none"/>
      <path d="M56 54 H146" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle cx="34" cy="46" r="6" fill="#E85D04"/>
    </g>
  </defs>

  <rect width="1080" height="1350" fill="#F3E9DC"/>
  <circle cx="860" cy="420" r="380" fill="url(#dotsP)" opacity="0.55"/>

  <!-- court key -->
  <rect x="300" y="780" width="500" height="600" fill="#5A189A"/>
  <path d="M300 1350 V780 H800 V1350" fill="none" stroke="#F3E9DC" stroke-width="14"/>
  <path d="M300 780 A250 250 0 0 1 800 780" fill="none" stroke="#1C1C1C" stroke-width="14"/>
  <path d="M800 780 A250 250 0 0 1 300 780" fill="none" stroke="#F3E9DC" stroke-width="10" stroke-dasharray="30 22"/>
  <path d="M260 940 H300 M260 1060 H300 M800 940 H840 M800 1060 H840" stroke="#1C1C1C" stroke-width="12"/>

  <!-- top bar -->
  <use xlink:href="#mark" transform="translate(64 64) scale(0.171875)"/>
  <text class="d" x="168" y="122" font-size="34" fill="#1C1C1C">PAINTCOURT</text>
  <text class="b" x="1016" y="104" font-size="22" font-weight="700" letter-spacing="2" fill="#1C1C1C" text-anchor="end">ISSUE 07</text>
  <text class="b" x="1016" y="134" font-size="22" font-weight="500" letter-spacing="2" fill="#1C1C1C" text-anchor="end">OCT 2026</text>
  <rect x="64" y="176" width="952" height="6" fill="#1C1C1C"/>

  <!-- sample sticker -->
  <g transform="rotate(5 868 236)">
    <rect x="720" y="204" width="296" height="64" rx="32" fill="#2EC4B6" stroke="#1C1C1C" stroke-width="4"/>
    <text class="b" x="868" y="246" font-size="26" font-weight="700" letter-spacing="3" fill="#1C1C1C" text-anchor="middle">SAMPLE STORY</text>
  </g>

  <!-- headline -->
  <text class="d" x="64" y="342" font-size="96" fill="#1C1C1C">WHO OWNS</text>
  <rect x="50" y="368" width="856" height="110" fill="#E85D04" transform="rotate(-2 478 423)"/>
  <text class="d" x="64" y="462" font-size="96" fill="#1C1C1C">THE PAINT?</text>
  <text class="b" font-size="34" font-weight="500" fill="#1C1C1C">
    <tspan x="64" y="548">Big men, small ball and the fight for</tspan>
    <tspan x="64" y="592">the most valuable 16 feet in the game.</tspan>
  </text>

  <!-- player feature card -->
  <g transform="rotate(-5 286 940)">
    <rect x="96" y="690" width="380" height="480" fill="#F3E9DC" stroke="#1C1C1C" stroke-width="6"/>
    <rect x="120" y="714" width="332" height="300" fill="#E85D04"/>
    <rect x="120" y="714" width="332" height="300" fill="url(#dotsI)" opacity="0.35"/>
    <circle cx="286" cy="800" r="50" fill="#1C1C1C"/>
    <path d="M196 1014 V900 C196 870 220 852 250 852 H322 C352 852 376 870 376 900 V1014 Z" fill="#5A189A" stroke="#1C1C1C" stroke-width="5"/>
    <path d="M250 852 C258 880 314 880 322 852" fill="none" stroke="#F3E9DC" stroke-width="6"/>
    <text class="d" x="286" y="972" font-size="64" fill="#F3E9DC" text-anchor="middle">31</text>
    <text class="b" x="120" y="1056" font-size="18" font-weight="700" letter-spacing="3" fill="#5A189A">FEATURE · CENTER</text>
    <text class="d" x="120" y="1100" font-size="30" fill="#1C1C1C">MARLO</text>
    <text class="d" x="120" y="1140" font-size="30" fill="#1C1C1C">QUINCE</text>
  </g>
  <rect x="236" y="676" width="120" height="34" fill="#2EC4B6" opacity="0.85" transform="rotate(8 296 693)"/>

  <!-- sneaker -->
  <use xlink:href="#shoe" fill="#E85D04" transform="translate(556 950) rotate(-8) scale(2.2)"/>

  <!-- swipe sticker -->
  <g transform="rotate(-12 930 1210)">
    <circle cx="930" cy="1210" r="88" fill="#1C1C1C"/>
    <circle cx="930" cy="1210" r="76" fill="none" stroke="#2EC4B6" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="d" x="930" y="1206" font-size="24" fill="#F3E9DC" text-anchor="middle">SWIPE</text>
    <path d="M896 1232 H958 M944 1220 L960 1232 L944 1244" fill="none" stroke="#2EC4B6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="b" x="64" y="1292" font-size="20" font-weight="500" fill="#1C1C1C">Fictional sample story · Oct 14, 2026 · 1/6</text>

  <rect width="1080" height="1350" filter="url(#grain)"/>
</svg>
