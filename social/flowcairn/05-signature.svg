<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <style>@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap');
    .d{font-family:'Lexend',system-ui,sans-serif}
    .b{font-family:'Source Sans 3','Segoe UI',sans-serif}</style>
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#0F766E" opacity=".16"/></pattern>
  </defs>
  <rect width="1080" height="1920" fill="#D1E7DD"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  <path d="M1080 120 C900 260 1000 420 860 560" fill="none" stroke="#0F766E" stroke-width="3" opacity=".35"/>
  <path d="M0 1700 C240 1620 480 1760 760 1690 S1000 1640 1080 1660 V1920 H0Z" fill="#13261F"/>

  <g transform="translate(72 132) scale(.42)">
    <circle cx="64" cy="8" r="6" fill="#0F766E"/>
    <rect x="38" y="22" width="52" height="28" rx="14" fill="#F59E0B" transform="rotate(3 64 36)"/>
    <rect x="22" y="54" width="84" height="30" rx="15" fill="#13261F" transform="rotate(-4 64 69)"/>
    <rect x="8" y="88" width="112" height="34" rx="17" fill="#0F766E"/>
  </g>
  <text x="138" y="174" class="d" font-size="36" font-weight="600" fill="#13261F">Flowcairn</text>
  <text x="1008" y="168" class="b" font-size="24" font-weight="700" fill="#13261F" text-anchor="end" letter-spacing="3">FIELD GUIDE 05</text>

  <text class="d" font-size="100" font-weight="700" fill="#13261F" letter-spacing="-3">
    <tspan x="72" y="340">Anatomy of</tspan>
    <tspan x="72" y="448">a calm</tspan>
    <tspan x="72" y="556" fill="#0F766E">workflow.</tspan>
  </text>
  <text x="1008" y="556" class="b" font-size="28" fill="#13261F" text-anchor="end">Five stones,</text>
  <text x="1008" y="592" class="b" font-size="28" fill="#13261F" text-anchor="end">stacked in order.</text>

  <g stroke="#13261F" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round">
    <path d="M540 840 V860"/><path d="M540 1020 V1040"/><path d="M540 1200 V1220"/><path d="M540 1380 V1400"/>
  </g>
  <g transform="rotate(-1.2 540 760)">
    <rect x="240" y="680" width="600" height="160" rx="80" fill="#F59E0B"/>
    <circle cx="316" cy="760" r="36" fill="#13261F"/>
    <text x="316" y="773" class="d" font-size="34" font-weight="700" fill="#F59E0B" text-anchor="middle">1</text>
    <text x="376" y="742" class="d" font-size="40" font-weight="700" fill="#13261F">Trigger</text>
    <text x="376" y="782" class="b" font-size="27" fill="#13261F">A form, an email or a sale</text>
    <text x="376" y="814" class="b" font-size="27" fill="#13261F">kicks things off.</text>
  </g>
  <g transform="rotate(1 540 940)">
    <rect x="200" y="860" width="680" height="160" rx="80" fill="#FFFFFF" stroke="#13261F" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="276" cy="940" r="36" fill="#0F766E"/>
    <text x="276" y="953" class="d" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="336" y="922" class="d" font-size="40" font-weight="700" fill="#13261F">Filter</text>
    <text x="336" y="962" class="b" font-size="27" fill="#13261F">Only the cases that matter</text>
    <text x="336" y="994" class="b" font-size="27" fill="#13261F">move forward.</text>
  </g>
  <g transform="rotate(-0.8 540 1120)">
    <rect x="160" y="1040" width="760" height="160" rx="80" fill="#13261F"/>
    <circle cx="236" cy="1120" r="36" fill="#F59E0B"/>
    <text x="236" y="1133" class="d" font-size="34" font-weight="700" fill="#13261F" text-anchor="middle">3</text>
    <text x="296" y="1102" class="d" font-size="40" font-weight="700" fill="#F3F6F4">Action</text>
    <text x="296" y="1142" class="b" font-size="27" fill="#F3F6F4">Data moves between tools,</text>
    <text x="296" y="1174" class="b" font-size="27" fill="#F3F6F4">with no copy and paste.</text>
  </g>
  <g transform="rotate(0.8 540 1300)">
    <rect x="120" y="1220" width="840" height="160" rx="80" fill="#FFFFFF" stroke="#13261F" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="196" cy="1300" r="36" fill="#0F766E"/>
    <text x="196" y="1313" class="d" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="256" y="1282" class="d" font-size="40" font-weight="700" fill="#13261F">Branch</text>
    <text x="256" y="1322" class="b" font-size="27" fill="#13261F">Rules pick a path. People</text>
    <text x="256" y="1354" class="b" font-size="27" fill="#13261F">handle the exceptions.</text>
  </g>
  <g transform="rotate(-0.5 540 1480)">
    <rect x="80" y="1400" width="920" height="160" rx="80" fill="#0F766E"/>
    <circle cx="156" cy="1480" r="36" fill="#F3F6F4"/>
    <text x="156" y="1493" class="d" font-size="34" font-weight="700" fill="#0F766E" text-anchor="middle">5</text>
    <text x="216" y="1462" class="d" font-size="40" font-weight="700" fill="#FFFFFF">Notify</text>
    <text x="216" y="1502" class="b" font-size="27" fill="#FFFFFF">The team sees what ran and</text>
    <text x="216" y="1534" class="b" font-size="27" fill="#FFFFFF">what still needs care.</text>
  </g>

  <text x="72" y="1800" class="d" font-size="38" font-weight="600" fill="#F3F6F4">Save this for your next ops review</text>
  <g transform="translate(964 1786)"><circle r="40" fill="#F59E0B"/><path d="M-14 0 H14 M3 -12 L15 0 L3 12" stroke="#13261F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
