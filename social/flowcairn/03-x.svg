<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap');
    .d{font-family:'Lexend',system-ui,sans-serif}
    .b{font-family:'Source Sans 3','Segoe UI',sans-serif}</style>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.8" fill="#0F766E" opacity=".18"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F3F6F4"/>
  <path d="M0 760 C220 700 420 820 700 770 S900 700 940 720 V900 H0Z" fill="#D1E7DD" opacity=".7"/>

  <!-- logo -->
  <g transform="translate(64 64) scale(.4)">
    <circle cx="64" cy="8" r="6" fill="#0F766E"/>
    <rect x="38" y="22" width="52" height="28" rx="14" fill="#F59E0B" transform="rotate(3 64 36)"/>
    <rect x="22" y="54" width="84" height="30" rx="15" fill="#13261F" transform="rotate(-4 64 69)"/>
    <rect x="8" y="88" width="112" height="34" rx="17" fill="#0F766E"/>
  </g>
  <text x="128" y="104" class="d" font-size="34" font-weight="600" fill="#13261F">Flowcairn</text>

  <rect x="64" y="160" width="350" height="48" rx="24" fill="#13261F"/>
  <circle cx="92" cy="184" r="8" fill="#F59E0B"/>
  <text x="112" y="193" class="b" font-size="24" font-weight="700" fill="#F3F6F4" letter-spacing="2">NEW: BRANCH STEPS</text>

  <text class="d" font-size="96" font-weight="700" fill="#13261F" letter-spacing="-3">
    <tspan x="64" y="320">Workflows that</tspan>
    <tspan x="64" y="424">know when to</tspan>
    <tspan x="64" y="528" fill="#0F766E">wait.</tspan>
  </text>
  <text class="b" font-size="30" fill="#3E5249">
    <tspan x="64" y="604">Conditional branches, wait-until steps and</tspan>
    <tspan x="64" y="644">retries that run themselves, now in Flowcairn.</tspan>
  </text>
  <rect x="64" y="694" width="480" height="72" rx="36" fill="#0F766E"/>
  <text x="304" y="740" class="b" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Now live in every workspace</text>

  <!-- diagram panel -->
  <rect x="940" y="64" width="596" height="772" rx="40" fill="#FFFFFF" stroke="#13261F" stroke-opacity=".12" stroke-width="2"/>
  <rect x="940" y="64" width="596" height="772" rx="40" fill="url(#dots)"/>
  <text x="980" y="120" class="b" font-size="22" font-weight="700" fill="#3E5249" letter-spacing="2">CONTRACT FLOW</text>
  <circle cx="1486" cy="113" r="8" fill="#0F766E"/><text x="1470" y="120" class="b" font-size="22" fill="#3E5249" text-anchor="end">running</text>

  <g fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round">
    <path d="M1238 226 V270" marker-end="url(#arr)"/>
    <path d="M1238 360 V404" marker-end="url(#arr)"/>
    <path d="M1212 466 C1150 500 1110 500 1110 540" marker-end="url(#arr)"/>
    <path d="M1264 466 C1326 500 1366 500 1366 540" marker-end="url(#arr)" stroke="#F59E0B" stroke-dasharray="10 10"/>
    <path d="M1110 616 C1110 660 1200 650 1226 690" marker-end="url(#arr)"/>
    <path d="M1366 616 C1366 660 1276 650 1250 690" marker-end="url(#arr)"/>
  </g>

  <g class="b" text-anchor="middle" font-weight="700">
    <rect x="1078" y="152" width="320" height="74" rx="37" fill="#0F766E"/>
    <text x="1238" y="199" font-size="28" fill="#FFFFFF">Form submitted</text>

    <rect x="1088" y="282" width="300" height="78" rx="39" fill="#F59E0B" transform="rotate(-1.5 1238 321)"/>
    <text x="1238" y="331" font-size="28" fill="#13261F">Wait until signed</text>

    <circle cx="1238" cy="442" r="34" fill="#13261F"/>
    <text x="1238" y="452" class="d" font-size="26" fill="#F59E0B">if</text>
    <text x="1112" y="508" font-size="20" fill="#0F766E">signed</text>
    <text x="1366" y="508" font-size="20" fill="#13261F">no reply</text>

    <rect x="986" y="546" width="248" height="70" rx="35" fill="#D1E7DD" stroke="#13261F" stroke-width="2"/>
    <text x="1110" y="590" font-size="26" fill="#13261F">Send contract</text>
    <rect x="1242" y="546" width="248" height="70" rx="35" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="1366" y="590" font-size="26" fill="#13261F">Retry in 1 day</text>

    <rect x="1098" y="700" width="280" height="76" rx="38" fill="#13261F"/>
    <text x="1238" y="747" font-size="28" fill="#D1E7DD">Notify the owner</text>
  </g>
</svg>
