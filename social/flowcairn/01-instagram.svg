<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap');
    .d{font-family:'Lexend',system-ui,sans-serif}
    .b{font-family:'Source Sans 3','Segoe UI',sans-serif}</style>
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#13261F" opacity=".09"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D1E7DD" stop-opacity="0"/><stop offset="1" stop-color="#D1E7DD"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#F3F6F4"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <path d="M0 980 C260 900 420 1060 700 990 S1000 880 1080 920 V1350 H0Z" fill="url(#fade)"/>

  <!-- logo -->
  <g transform="translate(72 64) scale(.42)">
    <circle cx="64" cy="8" r="6" fill="#0F766E"/>
    <rect x="38" y="22" width="52" height="28" rx="14" fill="#F59E0B" transform="rotate(3 64 36)"/>
    <rect x="22" y="54" width="84" height="30" rx="15" fill="#13261F" transform="rotate(-4 64 69)"/>
    <rect x="8" y="88" width="112" height="34" rx="17" fill="#0F766E"/>
  </g>
  <text x="138" y="106" class="d" font-size="36" font-weight="600" fill="#13261F">Flowcairn</text>
  <rect x="728" y="70" width="280" height="50" rx="25" fill="none" stroke="#0F766E" stroke-width="2"/>
  <text x="868" y="103" class="b" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="2">WORKFLOW NOTES 01</text>

  <!-- headline -->
  <text class="d" font-weight="700" font-size="100" fill="#13261F" letter-spacing="-3">
    <tspan x="72" y="290">Stack the</tspan>
    <tspan x="72" y="400">busywork.</tspan>
    <tspan x="72" y="510" fill="#0F766E">Let it flow.</tspan>
  </text>
  <text class="b" font-size="32" fill="#3E5249">
    <tspan x="72" y="586">Flowcairn turns repeat tasks into calm,</tspan>
    <tspan x="72" y="628">dependable workflows, one stone at a time.</tspan>
  </text>

  <!-- connector spine -->
  <path d="M150 724 V1140" stroke="#0F766E" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g fill="#F3F6F4" stroke="#0F766E" stroke-width="4">
    <circle cx="150" cy="763" r="14"/><circle cx="150" cy="878" r="14"/><circle cx="150" cy="1004" r="14"/><circle cx="150" cy="1140" r="14"/>
  </g>
  <g stroke="#0F766E" stroke-width="3" fill="none" opacity=".6">
    <path d="M164 763 H490"/><path d="M164 878 H420"/><path d="M164 1004 H360"/><path d="M164 1140 H300"/>
  </g>
  <circle cx="150" cy="1140" r="6" fill="#0F766E"/>

  <!-- cairn of tasks -->
  <circle cx="640" cy="694" r="14" fill="#0F766E"/>
  <g>
    <rect x="300" y="1080" width="660" height="120" rx="60" fill="#0F766E"/>
    <text x="630" y="1152" class="b" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Trigger: new order received</text>
  </g>
  <g transform="rotate(-2 630 1004)">
    <rect x="360" y="948" width="540" height="112" rx="56" fill="#13261F"/>
    <text x="630" y="1016" class="b" font-size="34" font-weight="700" fill="#D1E7DD" text-anchor="middle">Create the invoice</text>
  </g>
  <g transform="rotate(1.5 635 878)">
    <rect x="420" y="826" width="430" height="104" rx="52" fill="#D1E7DD" stroke="#13261F" stroke-width="3"/>
    <text x="635" y="890" class="b" font-size="32" font-weight="700" fill="#13261F" text-anchor="middle">Update the CRM</text>
  </g>
  <g transform="rotate(-2.5 640 763)">
    <rect x="490" y="716" width="300" height="94" rx="47" fill="#F59E0B"/>
    <text x="640" y="774" class="b" font-size="30" font-weight="700" fill="#13261F" text-anchor="middle">Notify the team</text>
  </g>

  <!-- footer cta -->
  <rect x="72" y="1222" width="936" height="2" fill="#13261F" opacity=".15"/>
  <text x="72" y="1272" class="b" font-size="30" font-weight="600" fill="#13261F">Swipe for four automations worth stacking</text>
  <g transform="translate(978 1262)"><circle r="30" fill="#13261F"/><path d="M-10 0 H10 M2 -9 L11 0 L2 9" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
