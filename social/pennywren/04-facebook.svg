<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Pennywren Facebook community campaign: The No-Spend Weekend challenge">
  <title>The No-Spend Weekend</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;600;700&amp;display=swap');
  .d{font-family:'Bricolage Grotesque','Trebuchet MS',Arial,sans-serif;font-weight:800;letter-spacing:-0.02em}
  .b{font-family:'Figtree','Segoe UI',Arial,sans-serif}</style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#FFFFFF" opacity="0.1"/></pattern>
    <g id="wren">
      <path d="M196 262 L118 132 Q110 114 128 110 L150 106 Q166 104 174 120 L240 236 Z" fill="#FFFFFF"/>
      <ellipse cx="262" cy="292" rx="118" ry="92" fill="#FFFFFF"/>
      <circle cx="334" cy="222" r="64" fill="#FFFFFF"/>
      <path d="M392 206 L440 222 L392 238 Z" fill="#F2B544"/>
      <circle cx="350" cy="208" r="12" fill="#1D2939"/>
      <circle cx="246" cy="290" r="50" fill="#F2B544"/>
      <circle cx="246" cy="290" r="34" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M232 380 L226 412 M282 380 L288 412" stroke="#1D2939" stroke-width="12" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="1500" fill="#1F7A5A"/>
  <rect width="1200" height="700" fill="url(#dots)"/>
  <circle cx="600" cy="460" r="330" fill="#24886A"/>
  <circle cx="600" cy="460" r="250" fill="#2A9273" opacity="0.6"/>

  <!-- logo -->
  <g transform="translate(64 64) scale(0.14)">
    <rect width="512" height="512" rx="120" fill="#FFFFFF"/>
    <path d="M196 262 L118 132 Q110 114 128 110 L150 106 Q166 104 174 120 L240 236 Z" fill="#1F7A5A"/>
    <ellipse cx="262" cy="292" rx="118" ry="92" fill="#1F7A5A"/>
    <circle cx="334" cy="222" r="64" fill="#1F7A5A"/>
    <path d="M392 206 L440 222 L392 238 Z" fill="#F2B544"/>
    <circle cx="350" cy="208" r="11" fill="#FFFFFF"/>
    <circle cx="246" cy="290" r="50" fill="#F2B544"/>
    <rect x="140" y="406" width="248" height="18" rx="9" fill="#1F7A5A"/>
  </g>
  <text class="d" x="152" y="113" font-size="40" fill="#FFFFFF">pennywren</text>
  <rect x="716" y="70" width="420" height="52" rx="26" fill="#F2B544"/>
  <text class="b" x="926" y="104" font-size="22" font-weight="700" fill="#1D2939" letter-spacing="2" text-anchor="middle">COMMUNITY CHALLENGE</text>

  <!-- envelope illustration -->
  <g>
    <rect x="404" y="226" width="200" height="150" rx="16" fill="#E8F3EE" transform="rotate(-8 504 300)"/>
    <text class="d" x="436" y="276" font-size="40" fill="#1F7A5A" transform="rotate(-8 504 300)">$0</text>
    <text class="b" x="436" y="306" font-size="20" font-weight="700" fill="#1D2939" transform="rotate(-8 504 300)">extras today</text>
    <rect x="606" y="236" width="190" height="140" rx="16" fill="#F2B544" transform="rotate(7 700 300)"/>
    <path d="M640 300 l22 22 l44 -48" fill="none" stroke="#1D2939" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="rotate(7 700 300)"/>
    <rect x="340" y="330" width="520" height="330" rx="36" fill="#FFFFFF"/>
    <path d="M352 352 L600 520 L848 352" fill="none" stroke="#1D2939" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M352 640 L520 500 M848 640 L680 500" stroke="#E8F3EE" stroke-width="8" stroke-linecap="round"/>
    <circle cx="600" cy="520" r="44" fill="#F2B544"/>
    <circle cx="600" cy="520" r="30" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <use xlink:href="#wren" href="#wren" transform="translate(722 206) scale(0.3)"/>
  </g>

  <!-- headline -->
  <text class="d" x="64" y="820" font-size="110" fill="#FFFFFF">The No-Spend</text>
  <text class="d" x="64" y="930" font-size="110" fill="#F2B544">Weekend.</text>
  <text class="b" x="64" y="996" font-size="34" font-weight="400" fill="#FFFFFF">Two days, zero extras, one cheerful group chat.</text>

  <!-- steps -->
  <g>
    <rect x="64" y="1040" width="336" height="220" rx="28" fill="#FFFFFF"/>
    <circle cx="124" cy="1098" r="28" fill="#F2B544"/>
    <text class="d" x="124" y="1110" font-size="32" fill="#1D2939" text-anchor="middle">1</text>
    <text class="d" x="96" y="1176" font-size="32" fill="#1D2939">Set the rules</text>
    <text class="b" x="96" y="1214" font-size="24" fill="#475467">Bills are fine,</text>
    <text class="b" x="96" y="1242" font-size="24" fill="#475467">extras can wait.</text>
  </g>
  <g>
    <rect x="432" y="1040" width="336" height="220" rx="28" fill="#FFFFFF"/>
    <circle cx="492" cy="1098" r="28" fill="#F2B544"/>
    <text class="d" x="492" y="1110" font-size="32" fill="#1D2939" text-anchor="middle">2</text>
    <text class="d" x="464" y="1176" font-size="32" fill="#1D2939">Pause the tabs</text>
    <text class="b" x="464" y="1214" font-size="24" fill="#475467">Log out of the</text>
    <text class="b" x="464" y="1242" font-size="24" fill="#475467">shopping apps.</text>
  </g>
  <g>
    <rect x="800" y="1040" width="336" height="220" rx="28" fill="#FFFFFF"/>
    <circle cx="860" cy="1098" r="28" fill="#F2B544"/>
    <text class="d" x="860" y="1110" font-size="32" fill="#1D2939" text-anchor="middle">3</text>
    <text class="d" x="832" y="1176" font-size="32" fill="#1D2939">Share a win</text>
    <text class="b" x="832" y="1214" font-size="24" fill="#475467">Post one free</text>
    <text class="b" x="832" y="1242" font-size="24" fill="#475467">thing you loved.</text>
  </g>

  <!-- CTA -->
  <rect x="64" y="1300" width="520" height="92" rx="46" fill="#F2B544"/>
  <text class="b" x="104" y="1359" font-size="36" font-weight="700" fill="#1D2939">Join the challenge  →</text>
  <text class="b" x="1136" y="1340" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="end">Sat + Sun, Oct 17–18</text>
  <text class="b" x="1136" y="1374" font-size="22" fill="#E8F3EE" text-anchor="end">Free, friendly, judgement-free</text>
  <text class="b" x="64" y="1436" font-size="22" fill="#E8F3EE">Educational, not financial advice. Fictional concept brand.</text>
</svg>
