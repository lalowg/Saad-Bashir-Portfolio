<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Cuewright Instagram carousel cover: Prompts are tools. Sharpen them.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    .serif{font-family:'Instrument Serif',Georgia,serif}
    .sans{font-family:'Geist',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',Menlo,Consolas,monospace}
    .it{font-style:italic}</style>
  <defs>
    <pattern id="rule" width="1080" height="54" patternUnits="userSpaceOnUse">
      <line x1="0" y1="53.5" x2="1080" y2="53.5" stroke="#1A1A1A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#FF4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1080" height="1350" fill="#FAF8F5"/>
  <rect width="1080" height="1350" fill="url(#rule)"/>
  <line x1="46" y1="0" x2="46" y2="1350" stroke="#FF4F00" stroke-opacity="0.45" stroke-width="2"/>

  <!-- top bar -->
  <g transform="translate(72 64)">
    <rect x="10" y="10" width="48" height="40" rx="8" fill="#FF4F00"/>
    <rect x="2" y="2" width="48" height="40" rx="8" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M14 14 L26 22 L14 30" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="12" width="6" height="20" rx="1" fill="#FF4F00"/>
    <text x="70" y="36" class="serif" font-size="42" fill="#1A1A1A">Cue<tspan class="it" fill="#FF4F00">wright</tspan></text>
  </g>
  <text x="1008" y="98" class="mono" font-size="24" fill="#1A1A1A" text-anchor="end" letter-spacing="2">01 / 06</text>

  <!-- headline -->
  <text class="mono" x="72" y="196" font-size="24" fill="#FF4F00" letter-spacing="3">FIELD NOTE NO. 14</text>
  <text class="serif" font-size="124" fill="#1A1A1A">
    <tspan x="68" y="318">Prompts are</tspan>
    <tspan x="68" y="436">tools.</tspan>
    <tspan x="68" y="554" class="it" fill="#FF4F00">Sharpen them.</tspan>
  </text>
  <!-- underline flourish -->
  <path d="M74 580 C 260 566, 520 590, 772 572" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- stamp -->
  <g transform="translate(876 330) rotate(-14)">
    <circle r="104" fill="none" stroke="#FF4F00" stroke-width="5"/>
    <circle r="86" fill="none" stroke="#FF4F00" stroke-width="2" stroke-dasharray="4 7"/>
    <text y="-26" class="mono" font-size="20" fill="#FF4F00" text-anchor="middle" letter-spacing="3">WORKSHOP</text>
    <text y="16" class="serif it" font-size="54" fill="#FF4F00" text-anchor="middle">tested</text>
    <text y="50" class="mono" font-size="18" fill="#FF4F00" text-anchor="middle" letter-spacing="3">BENCH 04</text>
  </g>

  <!-- prompt card -->
  <g transform="rotate(-2 540 860)">
    <rect x="124" y="664" width="852" height="420" rx="28" fill="#FF4F00"/>
    <rect x="104" y="644" width="852" height="420" rx="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <line x1="104" y1="712" x2="956" y2="712" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="140" cy="678" r="9" fill="#1A1A1A"/>
    <circle cx="170" cy="678" r="9" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="200" cy="678" r="9" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="920" y="687" class="mono" font-size="22" fill="#1A1A1A" text-anchor="end">brief-tightener.cue</text>
    <g class="mono" font-size="30" fill="#1A1A1A">
      <text x="144" y="782"><tspan fill="#FF4F00" font-weight="600">ROLE  </tspan>You are a careful editor.</text>
      <text x="144" y="842"><tspan fill="#FF4F00" font-weight="600">TASK  </tspan>Cut this brief to 120 words.</text>
      <text x="144" y="902"><tspan fill="#FF4F00" font-weight="600">KEEP  </tspan>every number and deadline.</text>
      <text x="144" y="962"><tspan fill="#FF4F00" font-weight="600">FORM  </tspan>3 bullets, then 1 question</text>
    </g>
    <rect x="144" y="992" width="18" height="40" fill="#FF4F00"/>
  </g>

  <!-- annotations -->
  <path d="M962 1180 C 992 1140, 984 1110, 944 1088" fill="none" stroke="#FF4F00" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="520" y="1200" class="serif it" font-size="42" fill="#1A1A1A">a job, a limit, a shape</text>
  <path d="M104 1150 L104 1110" fill="none" stroke="#FF4F00" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="72" y="1196" class="serif it" font-size="42" fill="#1A1A1A">labels first</text>

  <!-- footer cta -->
  <line x1="72" y1="1232" x2="1008" y2="1232" stroke="#1A1A1A" stroke-width="2"/>
  <text x="72" y="1282" class="sans" font-size="28" font-weight="600" fill="#1A1A1A">Swipe for the 5-part cue</text>
  <path d="M472 1272 L522 1272" stroke="#FF4F00" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <g transform="translate(856 1246)">
    <rect x="0" y="6" width="152" height="50" rx="10" fill="#1A1A1A"/>
    <rect x="0" y="0" width="152" height="46" rx="10" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="76" y="31" class="mono" font-size="20" fill="#1A1A1A" text-anchor="middle" letter-spacing="2">SWIPE</text>
  </g>
</svg>
