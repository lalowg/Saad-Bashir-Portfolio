<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="Cuewright LinkedIn post: Vague prompts cost you the second draft, with an illustrative rewrite chart.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    .serif{font-family:'Instrument Serif',Georgia,serif}
    .sans{font-family:'Geist',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',Menlo,Consolas,monospace}
    .it{font-style:italic}</style>
  <defs>
    <pattern id="grid-s" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1A1A1A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="grid-l" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0 H0 V120" fill="none" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#FF4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="key-ink">
      <rect x="0" y="8" width="112" height="64" rx="12" fill="#1A1A1A"/>
      <rect x="0" y="0" width="112" height="62" rx="12" fill="#2B2B2B" stroke="#1A1A1A" stroke-width="2"/>
      <rect x="10" y="8" width="92" height="40" rx="8" fill="#FAF8F5" fill-opacity="0.08"/>
    </g>
    <g id="key-or">
      <rect x="0" y="8" width="112" height="64" rx="12" fill="#1A1A1A"/>
      <rect x="0" y="0" width="112" height="62" rx="12" fill="#FF4F00" stroke="#1A1A1A" stroke-width="2"/>
      <rect x="10" y="8" width="92" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    </g>
  </defs>
  <rect width="1200" height="1350" fill="#FAF8F5"/>
  <rect width="1200" height="1350" fill="url(#grid-s)"/>
  <rect width="1200" height="1350" fill="url(#grid-l)"/>

  <!-- header -->
  <text x="72" y="104" class="mono" font-size="22" fill="#1A1A1A" letter-spacing="3">BENCH REPORT <tspan fill="#FF4F00">/</tspan> ILLUSTRATIVE</text>
  <g transform="translate(856 66)">
    <rect x="10" y="10" width="44" height="36" rx="7" fill="#FF4F00"/>
    <rect x="2" y="2" width="44" height="36" rx="7" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M13 13 L24 20 L13 27" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29" y="11" width="6" height="18" rx="1" fill="#FF4F00"/>
    <text x="64" y="34" class="serif" font-size="40" fill="#1A1A1A">Cue<tspan class="it" fill="#FF4F00">wright</tspan></text>
  </g>

  <!-- headline -->
  <text class="serif" font-size="108" fill="#1A1A1A">
    <tspan x="68" y="262">Vague prompts</tspan>
    <tspan x="68" y="370">cost you the</tspan>
    <tspan x="68" y="478" class="it" fill="#FF4F00">second draft.</tspan>
  </text>
  <text class="sans" font-size="30" fill="#2B2B2B">
    <tspan x="72" y="556">Same task, three briefs. We counted the rewrites</tspan>
    <tspan x="72" y="598">each one needed before the output was usable.</tspan>
  </text>

  <!-- chart card -->
  <rect x="80" y="652" width="1048" height="430" rx="24" fill="#1A1A1A"/>
  <rect x="72" y="644" width="1048" height="430" rx="24" fill="#FFD8C2" stroke="#1A1A1A" stroke-width="3"/>
  <text x="112" y="702" class="mono" font-size="20" fill="#1A1A1A" letter-spacing="2">REWRITES TO A USABLE DRAFT</text>
  <line x1="112" y1="722" x2="1080" y2="722" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- row 1 -->
  <text x="112" y="790" class="sans" font-size="28" font-weight="600" fill="#1A1A1A">Vague ask</text>
  <text x="112" y="822" class="mono" font-size="18" fill="#2B2B2B">"make this better"</text>
  <use href="#key-ink" x="380" y="760"/><use href="#key-ink" x="520" y="760"/><use href="#key-ink" x="660" y="760"/><use href="#key-ink" x="800" y="760"/><use href="#key-ink" x="940" y="760"/>
  <g class="mono" font-size="24" fill="#FAF8F5" text-anchor="middle">
    <text x="436" y="800">1</text><text x="576" y="800">2</text><text x="716" y="800">3</text><text x="856" y="800">4</text><text x="996" y="800">5</text>
  </g>

  <!-- row 2 -->
  <text x="112" y="896" class="sans" font-size="28" font-weight="600" fill="#1A1A1A">Role + task</text>
  <text x="112" y="928" class="mono" font-size="18" fill="#2B2B2B">two labelled lines</text>
  <use href="#key-ink" x="380" y="866"/><use href="#key-ink" x="520" y="866"/><use href="#key-ink" x="660" y="866"/>
  <g class="mono" font-size="24" fill="#FAF8F5" text-anchor="middle">
    <text x="436" y="906">1</text><text x="576" y="906">2</text><text x="716" y="906">3</text>
  </g>

  <!-- row 3 -->
  <text x="112" y="1002" class="sans" font-size="28" font-weight="600" fill="#1A1A1A">Full cue</text>
  <text x="112" y="1034" class="mono" font-size="18" fill="#2B2B2B">all five parts</text>
  <use href="#key-or" x="380" y="972"/>
  <text x="436" y="1012" class="mono" font-size="24" fill="#1A1A1A" text-anchor="middle" font-weight="600">1</text>

  <!-- annotation inside card -->
  <path d="M684 1010 C 630 1010, 576 1000, 512 1004" fill="none" stroke="#FF4F00" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="700" y="1000" class="serif it" font-size="40" fill="#1A1A1A">one pass,</text>
  <text x="700" y="1040" class="serif it" font-size="40" fill="#1A1A1A">when it is complete</text>

  <!-- footnote -->
  <text x="72" y="1136" class="mono" font-size="20" fill="#2B2B2B">* Illustrative figures from a sample workshop exercise. Not a study.</text>

  <!-- cta -->
  <line x1="72" y1="1182" x2="1128" y2="1182" stroke="#1A1A1A" stroke-width="2"/>
  <text class="sans" font-size="30" fill="#1A1A1A">
    <tspan x="72" y="1236" font-weight="600">Write the brief once.</tspan>
    <tspan x="72" y="1276">Skip the rewrite loop.</tspan>
  </text>
  <g transform="translate(760 1210)">
    <rect x="0" y="8" width="368" height="68" rx="14" fill="#FF4F00"/>
    <rect x="0" y="0" width="368" height="66" rx="14" fill="#1A1A1A"/>
    <text x="32" y="43" class="sans" font-size="24" font-weight="600" fill="#FAF8F5">Read the field notes</text>
    <rect x="330" y="18" width="10" height="30" fill="#FF4F00"/>
  </g>
</svg>
