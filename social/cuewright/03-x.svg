<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Cuewright X announcement: The Cue Library is open.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    .serif{font-family:'Instrument Serif',Georgia,serif}
    .sans{font-family:'Geist',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',Menlo,Consolas,monospace}
    .it{font-style:italic}</style>
  <defs>
    <pattern id="bp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FAF8F5" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#FF4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="cap">
      <rect x="0" y="16" width="160" height="160" rx="26" fill="#000000" fill-opacity="0.55"/>
      <rect x="0" y="0" width="160" height="160" rx="26" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3"/>
      <rect x="16" y="12" width="128" height="112" rx="18" fill="#FFFFFF" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#1A1A1A"/>
  <rect width="1600" height="900" fill="url(#bp)"/>
  <circle cx="1270" cy="430" r="330" fill="#FF4F00" fill-opacity="0.07"/>

  <!-- header -->
  <g transform="translate(72 64)">
    <rect x="10" y="10" width="48" height="40" rx="8" fill="#FF4F00"/>
    <rect x="2" y="2" width="48" height="40" rx="8" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M14 14 L26 22 L14 30" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="12" width="6" height="20" rx="1" fill="#FF4F00"/>
    <text x="72" y="37" class="serif" font-size="44" fill="#FAF8F5">Cue<tspan class="it" fill="#FF4F00">wright</tspan></text>
  </g>
  <text x="1528" y="100" class="mono" font-size="22" fill="#FFD8C2" text-anchor="end" letter-spacing="3">ANNOUNCEMENT / OCT 2026</text>

  <!-- headline -->
  <text class="serif" font-size="124" fill="#FAF8F5">
    <tspan x="66" y="318">The Cue Library</tspan>
    <tspan x="66" y="438" class="it" fill="#FF4F00">is open.</tspan>
  </text>
  <text class="sans" font-size="34" fill="#FFD8C2">
    <tspan x="72" y="530">240 field-tested prompt patterns, each</tspan>
    <tspan x="72" y="576">annotated with why it works.</tspan>
  </text>

  <!-- cta -->
  <g transform="translate(72 636)">
    <rect x="0" y="8" width="388" height="78" rx="16" fill="#FFD8C2"/>
    <rect x="0" y="0" width="388" height="76" rx="16" fill="#FF4F00"/>
    <text x="34" y="49" class="sans" font-size="30" font-weight="600" fill="#1A1A1A">Browse the library</text>
    <rect x="340" y="20" width="12" height="36" fill="#1A1A1A"/>
  </g>
  <text x="72" y="800" class="mono" font-size="22" fill="#FAF8F5" fill-opacity="0.8" letter-spacing="1">NEW  team shelves  /  version notes  /  copy as markdown</text>

  <!-- keycaps -->
  <g transform="translate(1000 214) rotate(-6 80 80)">
    <use href="#cap"/>
    <text x="80" y="100" class="serif" font-size="96" fill="#1A1A1A" text-anchor="middle">C</text>
  </g>
  <g transform="translate(1184 188)">
    <use href="#cap"/>
    <text x="80" y="100" class="serif it" font-size="96" fill="#FF4F00" text-anchor="middle">u</text>
  </g>
  <g transform="translate(1368 222) rotate(5 80 80)">
    <use href="#cap"/>
    <text x="80" y="100" class="serif" font-size="96" fill="#1A1A1A" text-anchor="middle">E</text>
  </g>

  <!-- blueprint dimension -->
  <line x1="1004" y1="452" x2="1004" y2="500" stroke="#FAF8F5" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="1524" y1="452" x2="1524" y2="500" stroke="#FAF8F5" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="1012" y1="480" x2="1516" y2="480" stroke="#FF4F00" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="1186" y="462" width="156" height="36" fill="#1A1A1A"/>
  <text x="1264" y="488" class="mono" font-size="22" fill="#FF4F00" text-anchor="middle" letter-spacing="2">240 CUES</text>

  <!-- shelf of cards -->
  <g transform="translate(1004 548)">
    <rect x="24" y="0" width="496" height="230" rx="18" fill="#2B2B2B" stroke="#FAF8F5" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="12" y="16" width="496" height="230" rx="18" fill="#2B2B2B" stroke="#FAF8F5" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="0" y="32" width="496" height="230" rx="18" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="0" y="32" width="160" height="40" rx="18" fill="#FF4F00"/>
    <rect x="0" y="52" width="160" height="20" fill="#FF4F00"/>
    <text x="24" y="60" class="mono" font-size="18" fill="#1A1A1A" font-weight="600" letter-spacing="1">SHELF 07</text>
    <text x="28" y="120" class="mono" font-size="22" fill="#1A1A1A">meeting-notes-to-actions</text>
    <text x="28" y="156" class="mono" font-size="22" fill="#1A1A1A">spec-to-test-plan</text>
    <text x="28" y="192" class="mono" font-size="22" fill="#1A1A1A">tone-match-rewrite</text>
    <rect x="28" y="214" width="12" height="28" fill="#FF4F00"/>
  </g>
</svg>
