<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Cuewright Facebook campaign: Prompt Clinic. Bring a messy prompt, leave with a sharp one.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    .serif{font-family:'Instrument Serif',Georgia,serif}
    .sans{font-family:'Geist',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',Menlo,Consolas,monospace}
    .it{font-style:italic}</style>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1A1A1A" fill-opacity="0.12"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="1500" fill="#FFD8C2"/>
  <rect width="1200" height="1130" fill="url(#dots)"/>

  <!-- header -->
  <g transform="translate(72 64)">
    <rect x="10" y="10" width="48" height="40" rx="8" fill="#FF4F00"/>
    <rect x="2" y="2" width="48" height="40" rx="8" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M14 14 L26 22 L14 30" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="12" width="6" height="20" rx="1" fill="#FF4F00"/>
    <text x="70" y="37" class="serif" font-size="44" fill="#1A1A1A">Cuewright</text>
  </g>
  <g transform="translate(888 70)">
    <rect width="240" height="46" rx="23" fill="#1A1A1A"/>
    <text x="120" y="30" class="mono" font-size="19" fill="#FAF8F5" text-anchor="middle" letter-spacing="2">COMMUNITY / FREE</text>
  </g>

  <!-- headline -->
  <rect x="418" y="462" width="530" height="42" fill="#FF4F00"/>
  <text class="serif" font-size="124" fill="#1A1A1A">
    <tspan x="66" y="262">Bring a messy</tspan>
    <tspan x="66" y="378">prompt. Leave</tspan>
    <tspan x="66" y="494">with a <tspan class="it">sharp one.</tspan></tspan>
  </text>
  <path d="M1010 300 C 1100 360, 1110 480, 1070 590" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M1070 590 L1060 630" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- ticket -->
  <g transform="rotate(-1.5 600 860)">
    <rect x="84" y="676" width="1044" height="368" rx="22" fill="#1A1A1A"/>
    <rect x="72" y="664" width="1044" height="368" rx="22" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="820" y1="684" x2="820" y2="1012" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
    <circle cx="820" cy="664" r="20" fill="#FFD8C2" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="820" cy="1032" r="20" fill="#FFD8C2" stroke="#1A1A1A" stroke-width="3"/>
    <text x="112" y="728" class="mono" font-size="20" fill="#FF4F00" font-weight="600" letter-spacing="3">PROMPT CLINIC / LIVE</text>
    <text x="112" y="806" class="serif" font-size="64" fill="#1A1A1A">Thursdays, <tspan class="it">18:00 GMT</tspan></text>
    <g class="mono" font-size="24" fill="#2B2B2B">
      <text x="112" y="868">45 min  /  online  /  cameras optional</text>
      <text x="112" y="910">3 member prompts, torn down live</text>
      <text x="112" y="952">every fix shown as a before / after</text>
    </g>
    <rect x="112" y="976" width="12" height="30" fill="#FF4F00"/>
    <!-- stamp -->
    <g transform="translate(968 848) rotate(12)">
      <circle r="98" fill="none" stroke="#FF4F00" stroke-width="5"/>
      <circle r="80" fill="none" stroke="#FF4F00" stroke-width="2"/>
      <text y="-20" class="mono" font-size="20" fill="#FF4F00" text-anchor="middle" letter-spacing="3">ADMIT</text>
      <text y="28" class="serif it" font-size="56" fill="#FF4F00" text-anchor="middle">one</text>
    </g>
  </g>

  <!-- bottom panel -->
  <rect y="1130" width="1200" height="370" fill="#1A1A1A"/>
  <text class="sans" font-size="34" fill="#FAF8F5">
    <tspan x="72" y="1214" font-weight="600">Free for everyone. Bring one prompt</tspan>
    <tspan x="72" y="1260">you keep rewriting. We will fix it together.</tspan>
  </text>
  <g transform="translate(72 1304)">
    <rect x="0" y="8" width="356" height="80" rx="16" fill="#FFD8C2"/>
    <rect x="0" y="0" width="356" height="78" rx="16" fill="#FF4F00"/>
    <text x="34" y="50" class="sans" font-size="30" font-weight="600" fill="#1A1A1A">Save your seat</text>
    <rect x="300" y="20" width="12" height="38" fill="#1A1A1A"/>
  </g>
  <!-- keycaps -->
  <g class="mono" font-size="22" font-weight="600" text-anchor="middle">
    <g transform="translate(792 1310)">
      <rect y="8" width="150" height="70" rx="12" fill="#000000"/>
      <rect width="150" height="66" rx="12" fill="#2B2B2B" stroke="#FAF8F5" stroke-opacity="0.4" stroke-width="2"/>
      <text x="75" y="42" fill="#FAF8F5">PASTE</text>
    </g>
    <text x="966" y="1352" fill="#FFD8C2">+</text>
    <g transform="translate(990 1310)">
      <rect y="8" width="138" height="70" rx="12" fill="#000000"/>
      <rect width="138" height="66" rx="12" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="2"/>
      <text x="69" y="42" fill="#1A1A1A">ENTER</text>
    </g>
  </g>
  <text x="72" y="1432" class="mono" font-size="20" fill="#FFD8C2" letter-spacing="1">Sessions are recorded for members. Opt out any time.</text>
</svg>
