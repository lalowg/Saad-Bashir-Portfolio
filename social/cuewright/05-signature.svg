<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Cuewright infographic: Anatomy of a cue, five labelled parts of a prompt.">
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    .serif{font-family:'Instrument Serif',Georgia,serif}
    .sans{font-family:'Geist',Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',Menlo,Consolas,monospace}
    .it{font-style:italic}
    .num{font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:20px;fill:#FF4F00;font-weight:600;letter-spacing:2px}
    .ttl{font-family:'Instrument Serif',Georgia,serif;font-size:42px;fill:#FAF8F5}
    .dsc{font-family:'Geist',Helvetica,Arial,sans-serif;font-size:20px;fill:#FFD8C2}
    .lbl{font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:15px;fill:#FF4F00;font-weight:600;letter-spacing:2px}
    .ex{font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:19px;fill:#1A1A1A}
    .wire{fill:none;stroke:#FF4F00;stroke-width:2.5;stroke-linecap:round}</style>
  <defs>
    <pattern id="bp-s" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#FAF8F5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="bp-l" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#FAF8F5" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#FF4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1080" height="1080" fill="#2B2B2B"/>
  <rect width="1080" height="1080" fill="url(#bp-s)"/>
  <rect width="1080" height="1080" fill="url(#bp-l)"/>

  <!-- header -->
  <g transform="translate(72 60)">
    <rect x="9" y="9" width="42" height="34" rx="7" fill="#FF4F00"/>
    <rect x="2" y="2" width="42" height="34" rx="7" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M12 12 L22 19 L12 26" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27" y="10" width="5" height="17" rx="1" fill="#FF4F00"/>
    <text x="62" y="32" class="serif" font-size="38" fill="#FAF8F5">Cue<tspan class="it" fill="#FF4F00">wright</tspan></text>
  </g>
  <text x="1008" y="90" class="mono" font-size="20" fill="#FFD8C2" text-anchor="end" letter-spacing="3">BLUEPRINT 05</text>

  <text x="68" y="214" class="serif" font-size="104" fill="#FAF8F5">Anatomy of a <tspan class="it" fill="#FF4F00">cue.</tspan></text>
  <text x="72" y="262" class="mono" font-size="20" fill="#FFD8C2" letter-spacing="1">Five labelled parts. Read top to bottom. Reuse forever.</text>

  <!-- card -->
  <rect x="352" y="312" width="400" height="570" rx="22" fill="#FF4F00"/>
  <rect x="340" y="300" width="400" height="570" rx="22" fill="#FAF8F5" stroke="#1A1A1A" stroke-width="3"/>
  <g stroke="#1A1A1A" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="356" y1="440" x2="724" y2="440"/>
    <line x1="356" y1="550" x2="724" y2="550"/>
    <line x1="356" y1="660" x2="724" y2="660"/>
    <line x1="356" y1="770" x2="724" y2="770"/>
  </g>
  <text x="362" y="370" class="lbl">ROLE</text>
  <text x="362" y="402" class="ex">You are a release-notes editor</text>
  <text x="362" y="480" class="lbl">CONTEXT</text>
  <text x="362" y="512" class="ex">Audience: non-technical users</text>
  <text x="362" y="590" class="lbl">TASK</text>
  <text x="362" y="622" class="ex">Summarise the 12 changes below</text>
  <text x="362" y="700" class="lbl">LIMITS</text>
  <text x="362" y="732" class="ex">Max 90 words. No jargon.</text>
  <text x="362" y="810" class="lbl">FORMAT</text>
  <text x="362" y="842" class="ex">Headline + 3 bullets</text>
  <rect x="604" y="824" width="11" height="24" fill="#FF4F00"/>

  <!-- left callouts -->
  <text x="72" y="356" class="num">01</text>
  <text x="72" y="398" class="ttl">Role</text>
  <text class="dsc"><tspan x="72" y="428">Who should answer?</tspan><tspan x="72" y="454">Name the expertise.</tspan></text>
  <path d="M168 386 L330 386" class="wire" marker-end="url(#ah)"/>

  <text x="72" y="576" class="num">03</text>
  <text x="72" y="618" class="ttl">Task</text>
  <text class="dsc"><tspan x="72" y="648">One verb, one</tspan><tspan x="72" y="674">clear deliverable.</tspan></text>
  <path d="M166 606 L330 606" class="wire" marker-end="url(#ah)"/>

  <text x="72" y="796" class="num">05</text>
  <text x="72" y="838" class="ttl">Format</text>
  <text class="dsc"><tspan x="72" y="868">The shape you want</tspan><tspan x="72" y="894">back, spelled out.</tspan></text>
  <path d="M206 826 L330 826" class="wire" marker-end="url(#ah)"/>

  <!-- right callouts -->
  <text x="826" y="466" class="num">02</text>
  <text x="826" y="508" class="ttl">Context</text>
  <text class="dsc"><tspan x="826" y="538">Who reads it, and</tspan><tspan x="826" y="564">what they know.</tspan></text>
  <path d="M812 496 L752 496" class="wire" marker-end="url(#ah)"/>

  <text x="826" y="686" class="num">04</text>
  <text x="826" y="728" class="ttl">Limits</text>
  <text class="dsc"><tspan x="826" y="758">Length and tone,</tspan><tspan x="826" y="784">and what to skip.</tspan></text>
  <path d="M812 716 L752 716" class="wire" marker-end="url(#ah)"/>

  <!-- bottom -->
  <line x1="72" y1="930" x2="1008" y2="930" stroke="#FAF8F5" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="72" y="990" class="sans" font-size="28" font-weight="600" fill="#FAF8F5">Save this. Build your next prompt on it.</text>
  <g transform="translate(870 952)">
    <rect y="8" width="138" height="56" rx="12" fill="#000000"/>
    <rect width="138" height="54" rx="12" fill="#FF4F00" stroke="#1A1A1A" stroke-width="2"/>
    <text x="69" y="35" class="mono" font-size="20" font-weight="600" fill="#1A1A1A" text-anchor="middle" letter-spacing="2">SAVE</text>
  </g>
</svg>
