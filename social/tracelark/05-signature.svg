<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Tracelark - Anatomy of a trace infographic">
<title>Tracelark - Anatomy of a trace infographic</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Fira+Code:wght@400;500&amp;display=swap');
.d{font-family:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;font-weight:700}
.b{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Fira Code',ui-monospace,monospace}</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#B388FF"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0E141C" stroke-width="1"/></pattern>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#121A24"/></pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.22"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="haloV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#B388FF" stop-opacity="0.2"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1080" height="1920" fill="#05070A"/>
<rect width="1080" height="1920" fill="url(#grid)"/><circle cx="180" cy="300" r="420" fill="url(#haloV)"/><circle cx="960" cy="1500" r="460" fill="url(#halo)"/><g transform="translate(64 120) scale(0.1171875)">
  <rect width="512" height="512" rx="112" fill="#0D1117" stroke="#1B2430" stroke-width="8"/>
  <path d="M84 300 H168 L204 196 L252 360 L300 140 L336 300 H372" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 140 L384 112 L344 180" fill="none" stroke="#B388FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="300" r="30" fill="#FF7849"/>
</g><text x="142" y="162.96" class="d" font-size="36" fill="#E6EDF3" letter-spacing="1">Tracelark</text><text x="1016" y="162" text-anchor="end" class="m" font-size="22" fill="#8B98A5">FIELD GUIDE 03</text><text class="d" font-size="112" fill="#E6EDF3"><tspan x="64" y="350">Anatomy</tspan><tspan x="64" y="466" fill="#00E5FF">of a trace</tspan></text><text x="64" y="532" class="b" font-size="30" fill="#8B98A5">Five parts every on-call engineer should know.</text><path d="M150 600V1700" stroke="#1B2430" stroke-width="3"/><rect x="64" y="600" width="952" height="196" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><circle cx="150" cy="698" r="44" fill="#05070A" stroke="#00E5FF" stroke-width="3"/><text x="150" y="708" text-anchor="middle" class="m" font-size="28" font-weight="500" fill="#00E5FF">01</text><text x="230" y="676" class="d" font-size="44" fill="#E6EDF3">Trace</text><text class="b" font-size="26" fill="#8B98A5"><tspan x="230" y="720">One request’s whole journey,</tspan><tspan x="230" y="756">from first hop to last.</tspan></text><rect x="700" y="690" width="284" height="20" rx="5" fill="#00E5FF"/><circle cx="700" cy="700" r="9" fill="#E6EDF3"/><circle cx="984" cy="700" r="9" fill="#E6EDF3"/><text x="700" y="670" class="m" font-size="18" fill="#8B98A5">start</text><text x="984" y="670" text-anchor="end" class="m" font-size="18" fill="#8B98A5">642ms</text><rect x="64" y="824" width="952" height="196" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><circle cx="150" cy="922" r="44" fill="#05070A" stroke="#B388FF" stroke-width="3"/><text x="150" y="932" text-anchor="middle" class="m" font-size="28" font-weight="500" fill="#B388FF">02</text><text x="230" y="900" class="d" font-size="44" fill="#E6EDF3">Span</text><text class="b" font-size="26" fill="#8B98A5"><tspan x="230" y="944">A single timed operation</tspan><tspan x="230" y="980">nested inside that journey.</tspan></text><rect x="700" y="872" width="284" height="20" rx="5" fill="#B388FF" opacity="0.35"/><rect x="730" y="902" width="120" height="20" rx="5" fill="#B388FF" opacity="1"/><rect x="860" y="932" width="90" height="20" rx="5" fill="#00E5FF" opacity="1"/><rect x="760" y="962" width="50" height="20" rx="5" fill="#B388FF" opacity="0.7"/><rect x="64" y="1048" width="952" height="196" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><circle cx="150" cy="1146" r="44" fill="#05070A" stroke="#00E5FF" stroke-width="3"/><text x="150" y="1156" text-anchor="middle" class="m" font-size="28" font-weight="500" fill="#00E5FF">03</text><text x="230" y="1124" class="d" font-size="44" fill="#E6EDF3">Attributes</text><text class="b" font-size="26" fill="#8B98A5"><tspan x="230" y="1168">Key-value context: route,</tspan><tspan x="230" y="1204">region, build, tenant.</tspan></text><rect x="700" y="1088" width="149" height="38" rx="8" fill="#05070A" stroke="#00E5FF" stroke-width="2"/><text x="712" y="1114" class="m" font-size="19" fill="#00E5FF">route=/cart</text><rect x="700" y="1138" width="127" height="38" rx="8" fill="#05070A" stroke="#00E5FF" stroke-width="2"/><text x="712" y="1164" class="m" font-size="19" fill="#00E5FF">region=eu</text><rect x="850" y="1138" width="127" height="38" rx="8" fill="#05070A" stroke="#00E5FF" stroke-width="2"/><text x="862" y="1164" class="m" font-size="19" fill="#00E5FF">build=4.2</text><rect x="64" y="1272" width="952" height="196" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><circle cx="150" cy="1370" r="44" fill="#05070A" stroke="#B388FF" stroke-width="3"/><text x="150" y="1380" text-anchor="middle" class="m" font-size="28" font-weight="500" fill="#B388FF">04</text><text x="230" y="1348" class="d" font-size="44" fill="#E6EDF3">Sparkline</text><text class="b" font-size="26" fill="#8B98A5"><tspan x="230" y="1392">Latency over time, so slow</tspan><tspan x="230" y="1428">drift shows up early.</tspan></text><polyline points="700.0,1412.0 725.8,1403.4 751.6,1407.7 777.5,1394.9 803.3,1399.1 829.1,1382.0 854.9,1386.3 880.7,1364.9 906.5,1369.1 932.4,1343.4 958.2,1352.0 984.0,1322.0" fill="none" stroke="#B388FF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M700 1412H984" stroke="#1B2430" stroke-width="2"/><rect x="64" y="1496" width="952" height="196" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><circle cx="150" cy="1594" r="44" fill="#05070A" stroke="#FF7849" stroke-width="3"/><text x="150" y="1604" text-anchor="middle" class="m" font-size="28" font-weight="500" fill="#FF7849">05</text><text x="230" y="1572" class="d" font-size="44" fill="#E6EDF3">Alert</text><text class="b" font-size="26" fill="#8B98A5"><tspan x="230" y="1616">A budget crossed, routed</tspan><tspan x="230" y="1652">to whoever is on call.</tspan></text><circle cx="760" cy="1594" r="46" fill="none" stroke="#FF7849" stroke-width="2" opacity="0.4"/><circle cx="760" cy="1594" r="28" fill="none" stroke="#FF7849" stroke-width="3" opacity="0.7"/><circle cx="760" cy="1594" r="12" fill="#FF7849" filter="url(#glow)"/><text x="830" y="1586" class="m" font-size="20" fill="#FF7849">p99 &gt; 800ms</text><text x="830" y="1618" class="m" font-size="18" fill="#8B98A5">paging on-call</text><rect x="64" y="1752" width="560" height="76" rx="38" fill="#00E5FF"/><text x="344" y="1799.36" text-anchor="middle" class="b" font-size="26" font-weight="600" fill="#05070A">Save this for your next on-call</text><text x="1016" y="1800" text-anchor="end" class="m" font-size="22" fill="#8B98A5">tracelark</text></svg>
