<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="Tracelark - Your p99 is a story, not a number">
<title>Tracelark - Your p99 is a story, not a number</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Fira+Code:wght@400;500&amp;display=swap');
.d{font-family:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;font-weight:700}
.b{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
.m{font-family:'Fira Code',ui-monospace,monospace}</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#B388FF"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0E141C" stroke-width="1"/></pattern>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#121A24"/></pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.22"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="haloV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#B388FF" stop-opacity="0.2"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="1350" fill="#05070A"/>
<rect width="1200" height="1350" fill="url(#dots)"/><circle cx="1080" cy="1000" r="420" fill="url(#haloV)"/><g transform="translate(64 64) scale(0.109375)">
  <rect width="512" height="512" rx="112" fill="#0D1117" stroke="#1B2430" stroke-width="8"/>
  <path d="M84 300 H168 L204 196 L252 360 L300 140 L336 300 H372" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 140 L384 112 L344 180" fill="none" stroke="#B388FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="300" r="30" fill="#FF7849"/>
</g><text x="138" y="104.24" class="d" font-size="34" fill="#E6EDF3" letter-spacing="1">Tracelark</text><text x="1136" y="102" text-anchor="end" class="m" font-size="20" fill="#B388FF">FIELD NOTES · LATENCY</text><path d="M64 160H1136" stroke="#1B2430" stroke-width="2"/><text class="d" font-size="88" fill="#E6EDF3"><tspan x="64" y="278">Your <tspan fill="#FF7849">p99</tspan> is</tspan><tspan x="64" y="374">a story, not</tspan><tspan x="64" y="470">a number.</tspan></text><text class="b" font-size="28" fill="#8B98A5"><tspan x="64" y="532">Averages flatten the requests that hurt. Read the</tspan><tspan x="64" y="570">whole distribution before you set an alert.</tspan></text><rect x="64" y="616" width="1072" height="420" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><text x="96" y="662" class="m" font-size="20" fill="#E6EDF3">GET /search · latency histogram</text><text x="1104" y="662" text-anchor="end" class="m" font-size="18" fill="#8B98A5">illustrative sample data</text><path d="M104 966H1096" stroke="#1B2430" stroke-width="2"/><rect x="109.0" y="950" width="31.3" height="16" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="150.3" y="903" width="31.3" height="63" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="191.7" y="831" width="31.3" height="135" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="233.0" y="766" width="31.3" height="200" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="274.3" y="741" width="31.3" height="225" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="315.7" y="754" width="31.3" height="212" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="357.0" y="782" width="31.3" height="184" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="398.3" y="813" width="31.3" height="153" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="439.7" y="842" width="31.3" height="124" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="481.0" y="865" width="31.3" height="101" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="522.3" y="883" width="31.3" height="83" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="563.7" y="898" width="31.3" height="68" rx="4" fill="#00E5FF" opacity="0.85"/><rect x="605.0" y="909" width="31.3" height="57" rx="4" fill="#B388FF" opacity="0.85"/><rect x="646.3" y="919" width="31.3" height="47" rx="4" fill="#B388FF" opacity="0.85"/><rect x="687.7" y="926" width="31.3" height="40" rx="4" fill="#B388FF" opacity="0.85"/><rect x="729.0" y="933" width="31.3" height="33" rx="4" fill="#B388FF" opacity="0.85"/><rect x="770.3" y="938" width="31.3" height="28" rx="4" fill="#B388FF" opacity="0.85"/><rect x="811.7" y="943" width="31.3" height="23" rx="4" fill="#B388FF" opacity="0.85"/><rect x="853.0" y="946" width="31.3" height="20" rx="4" fill="#B388FF" opacity="0.85"/><rect x="894.3" y="949" width="31.3" height="17" rx="4" fill="#FF7849" opacity="1"/><rect x="935.7" y="943" width="31.3" height="23" rx="4" fill="#FF7849" opacity="1"/><rect x="977.0" y="935" width="31.3" height="31" rx="4" fill="#FF7849" opacity="1"/><rect x="1018.3" y="944" width="31.3" height="22" rx="4" fill="#FF7849" opacity="1"/><rect x="1059.7" y="953" width="31.3" height="13" rx="4" fill="#FF7849" opacity="1"/><line x1="310.7" y1="696" x2="310.7" y2="966" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6 6"/><text x="320.7" y="712" class="m" font-size="20" fill="#00E5FF">p50 84ms</text><line x1="600.0" y1="696" x2="600.0" y2="966" stroke="#B388FF" stroke-width="2" stroke-dasharray="6 6"/><text x="610.0" y="712" class="m" font-size="20" fill="#B388FF">p95 310ms</text><line x1="910.0" y1="696" x2="910.0" y2="966" stroke="#FF7849" stroke-width="2" stroke-dasharray="6 6"/><text x="920.0" y="712" class="m" font-size="20" fill="#FF7849">p99 1.2s</text><text x="104.0" y="1000" text-anchor="start" class="m" font-size="16" fill="#8B98A5">faster</text><text x="600.0" y="1000" text-anchor="middle" class="m" font-size="16" fill="#8B98A5">response time</text><text x="1096.0" y="1000" text-anchor="end" class="m" font-size="16" fill="#8B98A5">slower</text><rect x="64" y="1068" width="336" height="4" fill="#00E5FF"/><text x="64" y="1112" class="m" font-size="20" fill="#00E5FF">01</text><text x="64" y="1154" class="d" font-size="32" fill="#E6EDF3">Slice by route</text><text class="b" font-size="22" fill="#8B98A5"><tspan x="64" y="1192">One endpoint can hide</tspan><tspan x="64" y="1224">behind a healthy mean.</tspan></text><rect x="432" y="1068" width="336" height="4" fill="#B388FF"/><text x="432" y="1112" class="m" font-size="20" fill="#B388FF">02</text><text x="432" y="1154" class="d" font-size="32" fill="#E6EDF3">Follow the tail</text><text class="b" font-size="22" fill="#8B98A5"><tspan x="432" y="1192">Open the slowest trace</tspan><tspan x="432" y="1224">and read its spans.</tspan></text><rect x="800" y="1068" width="336" height="4" fill="#FF7849"/><text x="800" y="1112" class="m" font-size="20" fill="#FF7849">03</text><text x="800" y="1154" class="d" font-size="32" fill="#E6EDF3">Alert on budgets</text><text class="b" font-size="22" fill="#8B98A5"><tspan x="800" y="1192">Page on error budgets,</tspan><tspan x="800" y="1224">not single spikes.</tspan></text><text x="64" y="1278" class="m" font-size="20" fill="#8B98A5">observability for people who ship</text><text x="1136" y="1278" text-anchor="end" class="b" font-size="22" font-weight="600" fill="#00E5FF">Full field note in the comments</text></svg>
