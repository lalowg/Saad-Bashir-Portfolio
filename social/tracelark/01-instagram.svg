</g><text x="146" y="110.4" class="d" font-size="40" fill="#E6EDF3" letter-spacing="1">Tracelark</text><text x="1016" y="106" text-anchor="end" class="m" font-size="22" fill="#8B98A5">trace_id 7f3a9c</text><text class="d" font-size="104" fill="#E6EDF3"><tspan x="64" y="268">Find the</tspan><tspan x="64" y="380" fill="#00E5FF">slow span</tspan><tspan x="64" y="492">in seconds.</tspan></text><text x="64" y="560" class="b" font-size="30" fill="#8B98A5">Every request, every hop, one waterfall.</text><rect x="64" y="616" width="952" height="520" rx="20" fill="#0D1117" stroke="#1B2430" stroke-width="2"/><path d="M64 676H1016" stroke="#1B2430" stroke-width="2"/><circle cx="96" cy="646" r="7" fill="#FF7849"/><circle cx="120" cy="646" r="7" fill="#B388FF"/><circle cx="144" cy="646" r="7" fill="#00E5FF"/><text x="184" y="654" class="m" font-size="22" fill="#E6EDF3">POST /api/checkout</text><text x="984" y="654" text-anchor="end" class="m" font-size="22" fill="#00E5FF">642 ms</text><line x1="380.0" y1="692" x2="380.0" y2="1016" stroke="#1B2430" stroke-width="1" stroke-dasharray="4 6"/><text x="380.0" y="712" text-anchor="start" class="m" font-size="16" fill="#8B98A5">0ms</text><line x1="528.5" y1="692" x2="528.5" y2="1016" stroke="#1B2430" stroke-width="1" stroke-dasharray="4 6"/><text x="528.5" y="712" text-anchor="middle" class="m" font-size="16" fill="#8B98A5">160ms</text><line x1="677.1" y1="692" x2="677.1" y2="1016" stroke="#1B2430" stroke-width="1" stroke-dasharray="4 6"/><text x="677.1" y="712" text-anchor="middle" class="m" font-size="16" fill="#8B98A5">320ms</text><line x1="825.6" y1="692" x2="825.6" y2="1016" stroke="#1B2430" stroke-width="1" stroke-dasharray="4 6"/><text x="825.6" y="712" text-anchor="middle" class="m" font-size="16" fill="#8B98A5">480ms</text><line x1="974.1" y1="692" x2="974.1" y2="1016" stroke="#1B2430" stroke-width="1" stroke-dasharray="4 6"/><text x="974.1" y="712" text-anchor="end" class="m" font-size="16" fill="#8B98A5">640ms</text><text x="96" y="755" class="m" font-size="22" fill="#8B98A5">gateway</text><rect x="380.0" y="736" width="596.0" height="24" rx="5" fill="#00E5FF"/><text x="116" y="805" class="m" font-size="22" fill="#8B98A5">auth.verify</text><rect x="387.4" y="786" width="50.1" height="24" rx="5" fill="#B388FF"/><text x="116" y="855" class="m" font-size="22" fill="#8B98A5">cart.load</text><rect x="445.0" y="836" width="102.1" height="24" rx="5" fill="#00E5FF"/><text x="116" y="905" class="m" font-size="22" fill="#8B98A5">pricing.calc</text><rect x="552.7" y="886" width="50.1" height="24" rx="5" fill="#B388FF"/><rect x="76" y="926" width="928" height="44" rx="8" fill="#FF7849" opacity="0.1"/><text x="116" y="955" class="m" font-size="22" fill="#FF7849">db.query</text><rect x="599.1" y="936" width="336.1" height="24" rx="5" fill="#FF7849" filter="url(#glow)"/><text x="116" y="1005" class="m" font-size="22" fill="#8B98A5">payment.auth</text><rect x="937.0" y="986" width="33.4" height="24" rx="5" fill="#00E5FF"/><text x="599.1" y="1036" class="m" font-size="18" fill="#FF7849">362 ms · slowest span</text><path d="M96 1060H984" stroke="#1B2430" stroke-width="2"/><text x="96" y="1104" class="b" font-size="24" fill="#E6EDF3">db.query took <tspan fill="#FF7849" font-weight="600">56%</tspan> of this request. Start there.</text><rect x="64" y="1186" width="480" height="80" rx="40" fill="#00E5FF"/><text x="304" y="1236.08" text-anchor="middle" class="b" font-size="28" font-weight="600" fill="#05070A">Swipe for 5 tracing habits</text><polyline points="620.0,1256.0 643.6,1250.5 667.3,1253.3 690.9,1239.6 714.5,1247.8 738.2,1228.7 761.8,1236.9 785.5,1196.0 809.1,1231.5 832.7,1245.1 856.4,1247.8 880.0,1250.5" fill="none" stroke="#B388FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1016" y="1238" text-anchor="end" class="m" font-size="22" fill="#8B98A5">1/6</text></svg>
