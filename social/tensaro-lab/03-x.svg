</g><text class="ms" x="64" y="236" font-size="24" fill="#005F92" letter-spacing="3">NEW PROTOCOL / RELEASE 04</text><text class="d" font-size="90" fill="#0E1A24" letter-spacing="-2"><tspan x="60" y="340">The Desk-Bound</tspan><tspan x="60" y="436">Hip Protocol.</tspan></text><rect x="64" y="462" width="120" height="8" fill="#FF6B6B"/><text class="b" font-size="30" fill="#4A5A68"><tspan x="64" y="528">12 minutes. 5 positions. Logged every time.</tspan><tspan x="64" y="570">A guided sequence for people who sit all day.</tspan></text><rect x="64" y="612" width="330" height="70" rx="35" fill="#0077B6"/><text class="bs" x="229" y="656" font-size="27" fill="#FFFFFF" text-anchor="middle">Get early access</text><rect x="418" y="612" width="330" height="70" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="583" y="655" font-size="21" fill="#0E1A24" text-anchor="middle" letter-spacing="2">OPENS 14 OCT 2026</text><path d="M64 806v-22M80 806v-10M96 806v-10M112 806v-10M128 806v-10M144 806v-22M160 806v-10M176 806v-10M192 806v-10M208 806v-10M224 806v-22M240 806v-10M256 806v-10M272 806v-10M288 806v-10M304 806v-22M320 806v-10M336 806v-10M352 806v-10M368 806v-10M384 806v-22M400 806v-10M416 806v-10M432 806v-10M448 806v-10M464 806v-22M480 806v-10M496 806v-10M512 806v-10M528 806v-10M544 806v-22M560 806v-10M576 806v-10M592 806v-10M608 806v-10M624 806v-22M640 806v-10M656 806v-10M672 806v-10M688 806v-10M704 806v-22M720 806v-10M736 806v-10M752 806v-10M768 806v-10M784 806v-22M800 806v-10M816 806v-10M832 806v-10M848 806v-10" stroke="#0E1A24" stroke-width="2" fill="none"/><text class="m" x="64" y="832" font-size="16" fill="#4A5A68" text-anchor="middle">0</text><text class="m" x="144" y="832" font-size="16" fill="#4A5A68" text-anchor="middle">5</text><text class="m" x="224" y="832" font-size="16" fill="#4A5A68" text-anchor="middle">10</text><text class="m" x="304" y="832" font-size="16" fill="#4A5A68" text-anchor="middle">15</text><text class="m" x="384" y="832" font