<text class="m" x="198" y="148" font-size="17" fill="#4A5A68" letter-spacing="2.5">MOBILITY / RECOVERY / PERFORMANCE</text>
</g><text class="ms" x="1016" y="182" font-size="20" fill="#FFFFFF" text-anchor="end" letter-spacing="3">DAY LOG 01</text><text class="d" font-size="100" fill="#FFFFFF" letter-spacing="-2.5"><tspan x="60" y="370">A recovery</tspan><tspan x="60" y="470">day, logged.</tspan></text><text class="b" x="64" y="526" font-size="28" fill="#FFFFFF">Seven checkpoints. Small inputs, written down.</text><path d="M150 620V1600" stroke="#0E1A24" stroke-width="3"/><path d="M150 620h-26M150 635h-12M150 650h-12M150 665h-12M150 680h-12M150 695h-26M150 710h-12M150 725h-12M150 740h-12M150 755h-12M150 770h-26M150 785h-12M150 800h-12M150 815h-12M150 830h-12M150 845h-26M150 860h-12M150 875h-12M150 890h-12M150 905h-12M150 920h-26M150 935h-12M150 950h-12M150 965h-12M150 980h-12M150 995h-26M150 1010h-12M150 1025h-12M150 1040h-12M150 1055h-12M150 1070h-26M150 1085h-12M150 1100h-12M150 1115h-12M150 1130h-12M150 1145h-26M150 1160h-12M150 1175h-12M150 1190h-12M150 1205h-12M150 1220h-26M150 1235h-12M150 1250h-12M150 1265h-12M150 1280h-12M150 1295h-26M150 1310h-12M150 1325h-12M150 1340h-12M150 1355h-12M150 1370h-26M150 1385h-12M150 1400h-12M150 1415h-12M150 1430h-12M150 1445h-26M150 1460h-12M150 1475h-12M150 1490h-12M150 1505h-12M150 1520h-26M150 1535h-12M150 1550h-12M150 1565h-12M150 1580h-12M150 1595h-26" stroke="#0E1A24" stroke-width="2"/><circle cx="150" cy="660" r="16" fill="#00B4A0" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="669" font-size="26" fill="#0E1A24">06:30</text><path d="M300 660H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="672" font-size="40" fill="#0E1A24">Joint circles</text><text class="b" x="358" y="714" font-size="24" fill="#4A5A68">Neck to ankles, slow and controlled.</text><rect x="896" y="638" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="666" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">5 MIN</text><circle cx="150" cy="810" r="16" fill="#0077B6" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="819" font-size="26" fill="#0E1A24">07:15</text><path d="M300 810H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="822" font-size="40" fill="#0E1A24">Daylight walk</text><text class="b" x="358" y="864" font-size="24" fill="#4A5A68">Easy pace. Water bottle comes along.</text><rect x="896" y="788" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="816" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">20 MIN</text><circle cx="150" cy="960" r="16" fill="#00B4A0" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="969" font-size="26" fill="#0E1A24">12:30</text><path d="M300 960H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="972" font-size="40" fill="#0E1A24">Desk-break flow</text><text class="b" x="358" y="1014" font-size="24" fill="#4A5A68">Stand, hinge, rotate, reach.</text><rect x="896" y="938" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="966" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">2 MIN</text><circle cx="150" cy="1110" r="16" fill="#FF6B6B" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="1119" font-size="26" fill="#0E1A24">17:30</text><path d="M300 1110H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="1122" font-size="40" fill="#0E1A24">Train + measure</text><text class="b" x="358" y="1164" font-size="24" fill="#4A5A68">Log one range reading before you lift.</text><rect x="896" y="1088" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="1116" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">45 MIN</text><circle cx="150" cy="1260" r="16" fill="#0077B6" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="1269" font-size="26" fill="#0E1A24">19:00</text><path d="M300 1260H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="1272" font-size="40" fill="#0E1A24">Easy cooldown</text><text class="b" x="358" y="1314" font-size="24" fill="#4A5A68">Low-intensity spin or a short stroll.</text><rect x="896" y="1238" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="1266" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">10 MIN</text><circle cx="150" cy="1410" r="16" fill="#00B4A0" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="1419" font-size="26" fill="#0E1A24">21:00</text><path d="M300 1410H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="1422" font-size="40" fill="#0E1A24">Downshift</text><text class="b" x="358" y="1464" font-size="24" fill="#4A5A68">Slow breathing, soft-tissue work.</text><rect x="896" y="1388" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="1416" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">8 MIN</text><circle cx="150" cy="1560" r="16" fill="#FF6B6B" stroke="#0E1A24" stroke-width="3"/><text class="ms" x="190" y="1569" font-size="26" fill="#0E1A24">22:30</text><path d="M300 1560H340" stroke="#0E1A24" stroke-width="2"/><text class="d" x="356" y="1572" font-size="40" fill="#0E1A24">Sleep window</text><text class="b" x="358" y="1614" font-size="24" fill="#4A5A68">Same time most nights. Screens away.</text><rect x="896" y="1538" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#0E1A24" stroke-width="2"/><text class="ms" x="956" y="1566" font-size="18" fill="#0E1A24" text-anchor="middle" letter-spacing="1.5">LOG</text><rect x="64" y="1640" width="952" height="136" rx="10" fill="#0E1A24"/><text class="d" x="104" y="1698" font-size="38" fill="#EEF3F6">Save this. Log it for a week.</text><text class="m" x="104" y="1742" font-size="18" fill="#8FA3B3" letter-spacing="1">General movement habits, not medical advice.</text><circle cx="960" cy="1708" r="24" fill="#FF6B6B"/><path d="M950 1708h20M962 1700l8 8-8 8" stroke="#0E1A24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
