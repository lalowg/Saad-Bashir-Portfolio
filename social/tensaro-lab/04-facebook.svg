iddle">Thoracic turn</text><circle cx="840" cy="780" r="46" fill="#0E1A24"/><circle cx="840" cy="780" r="56" fill="none" stroke="#0E1A24" stroke-width="2" stroke-dasharray="2 6"/><text class="ms" x="840" y="790" font-size="28" fill="#EEF3F6" text-anchor="middle">04</text><text class="dm" x="840" y="876" font-size="28" fill="#0E1A24" text-anchor="middle">Shoulder reach</text><circle cx="1010" cy="960" r="46" fill="#FF6B6B"/><circle cx="1010" cy="960" r="56" fill="none" stroke="#0E1A24" stroke-width="2" stroke-dasharray="2 6"/><text class="ms" x="1010" y="970" font-size="28" fill="#0E1A24" text-anchor="middle">05</text><text class="dm" x="1090" y="1056" font-size="28" fill="#0E1A24" text-anchor="end">Debrief</text><path d="M96 1100H1104" stroke="#C9D6DF" stroke-width="2"/><path d="M96 1100v-22M117 1100v-10M138 1100v-10M159 1100v-10M180 1100v-22M201 1100v-10M222 1100v-10M243 1100v-10M264 1100v-22M285 1100v-10M306 1100v-10M327 1100v-10M348 1100v-22M369 1100v-10M390 1100v-10M411 1100v-10M432 1100v-22M453 1100v-10M474 1100v-10M495 1100v-10M516 1100v-22M537 1100v-10M558 1100v-10M579 1100v-10M600 1100v-22M621 1100v-10M642 1100v-10M663 1100v-10M684 1100v-22M705 1100v-10M726 1100v-10M747 1100v-10M768 1100v-22M789 1100v-10M810 1100v-10M831 1100v-10M852 1100v-22M873 1100v-10M894 1100v-10M915 1100v-10M936 1100v-22M957 1100v-10M978 1100v-10M999 1100v-10M1020 1100v-22M1041 1100v-10M1062 1100v-10M1083 1100v-10M1104 1100v-22" stroke="#8FA3B3" stroke-width="2" fill="none"/><rect x="64" y="1180" width="1072" height="170" rx="10" fill="#0E1A24"/><text class="ms" x="104" y="1236" font-size="20" fill="#00B4A0" letter-spacing="3">EVERY SATURDAY</text><text class="d" x="104" y="1306" font-size="54" fill="#EEF3F6">09:00 – 12:00</text><rect x="720" y="1230" width="376" height="72" rx="36" fill="#FF6B6B"/><text class="bs" x="908" y="1276" font-size="28" fill="#0E1A24" text-anchor="middle">Reserve a slot</text><text class="m" x="64" y="1414" font-size="18" fill="#4A5A68" letter-spacing="0.5">S