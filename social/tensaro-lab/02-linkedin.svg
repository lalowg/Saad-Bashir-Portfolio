</g><text class="ms" x="1136" y="112" font-size="20" fill="#8FA3B3" text-anchor="end" letter-spacing="3">FIELD NOTES / 07</text><path d="M64 180H1136" stroke="#2A4458" stroke-width="2"/><text class="d" font-size="82" fill="#EEF3F6" letter-spacing="-1.5"><tspan x="64" y="290">Recovery isn't a</tspan><tspan x="64" y="380">feeling. It's a</tspan><tspan x="64" y="470" fill="#00B4A0">trend line.</tspan></text><path d="M680 460L740 448L800 452L860 410L920 420L980 370L1040 380L1100 320" fill="none" stroke="#00B4A0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1100" cy="320" r="10" fill="#FF6B6B"/><text class="m" x="1100" y="476" font-size="16" fill="#8FA3B3" text-anchor="end" letter-spacing="1">ILLUSTRATIVE TREND</text><text class="b" font-size="30" fill="#C9D6DF"><tspan x="64" y="540">The four signals we log every session, so</tspan><tspan x="64" y="582">progress is visible, not guessed.</tspan></text><g><rect x="64" y="624" width="520" height="244" rx="8" fill="#102231" stroke="#2A4458" stroke-width="2"/><path d="M74 652V634H92M556 634H574V652M574 840V858H556M92 858H74V840" fill="none" stroke="#00B4A0" stroke-width="3"/>
