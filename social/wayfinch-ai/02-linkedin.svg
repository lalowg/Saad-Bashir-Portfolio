<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="Wayfinch AI LinkedIn post: Beginners do not need more tools, they need a route">
  <title>Beginners need a route, not more tools</title>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap');
  .d{font-family:'Archivo Black','Arial Black',sans-serif}.b{font-family:'Archivo',Arial,sans-serif}]]></style>
  <defs>
    <g id="finchL">
      <path d="M18 60 C18 38 36 24 57 26 C69 27 77 34 80 42 L80 52 C77 68 63 78 45 78 L22 88 L30 72 C22 69 18 65 18 60 Z" fill="#FDFBF4"/>
      <path d="M32 56 C42 44 58 44 68 54 C58 64 42 66 32 56 Z" fill="#FDE68A"/>
      <path d="M79 41 L95 47 L79 53 Z" fill="#F97316"/>
      <circle cx="66" cy="40" r="3.6" fill="#1E2A3A"/>
    </g>
  </defs>
  <rect width="1200" height="1350" fill="#FDFBF4"/>
  <!-- ink header block -->
  <rect width="1200" height="580" fill="#1E2A3A"/>
  <g fill="none" stroke="#FDFBF4" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1060" cy="190" r="90"/><circle cx="1060" cy="190" r="150"/><circle cx="1060" cy="190" r="210"/><circle cx="1060" cy="190" r="270"/>
  </g>
  <!-- compass -->
  <g transform="translate(1060 190) scale(0.8)">
    <path d="M0 -120 L22 0 L0 120 L-22 0 Z" fill="#FDFBF4" fill-opacity="0.12"/>
    <path d="M0 -120 L22 0 L-22 0 Z" fill="#F97316"/>
    <path d="M-120 0 L0 -16 L120 0 L0 16 Z" fill="#FDFBF4" fill-opacity="0.12"/>
    <circle r="10" fill="#FDE68A"/>
  </g>
  <!-- lockup light -->
  <g transform="translate(64 64)">
    <rect width="66" height="66" rx="16" fill="#2563EB"/>
    <g transform="translate(9 6) scale(0.52)"><use xlink:href="#finchL" href="#finchL"/></g>
    <text x="84" y="46" class="d" font-size="34" fill="#FDFBF4">Wayfinch<tspan fill="#FDE68A" dx="10">AI</tspan></text>
  </g>
  <text class="d" font-size="78" fill="#FDFBF4">
    <tspan x="64" y="270">Beginners don't</tspan>
    <tspan x="64" y="362">need more tools.</tspan>
    <tspan x="64" y="454" fill="#FDE68A">They need a route.</tspan>
  </text>
  <text x="64" y="520" class="b" font-size="26" fill="#FDFBF4" fill-opacity="0.85">Field notes from the Wayfinch tutorial desk</text>
  <!-- dotted route leaving header -->
  <path d="M760 540 C820 600 900 560 960 620" fill="none" stroke="#F97316" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 16"/>
  <!-- chart -->
  <text x="64" y="668" class="d" font-size="40" fill="#1E2A3A">What readers ask before they start</text>
  <text x="64" y="708" class="b" font-size="24" fill="#4A5668">Share of reader notes mentioning each question</text>
  <g class="b">
    <text x="64" y="776" font-size="26" font-weight="700" fill="#1E2A3A">Is my data kept private?</text>
    <rect x="64" y="792" width="860" height="28" rx="14" fill="#1E2A3A" fill-opacity="0.08"/>
    <rect x="64" y="792" width="585" height="28" rx="14" fill="#F97316"/>
    <text x="1136" y="818" text-anchor="end" class="d" font-size="34" fill="#1E2A3A">68%</text>

    <text x="64" y="868" font-size="26" font-weight="700" fill="#1E2A3A">Will it fit how I already work?</text>
    <rect x="64" y="884" width="860" height="28" rx="14" fill="#1E2A3A" fill-opacity="0.08"/>
    <rect x="64" y="884" width="464" height="28" rx="14" fill="#2563EB"/>
    <text x="1136" y="910" text-anchor="end" class="d" font-size="34" fill="#1E2A3A">54%</text>

    <text x="64" y="960" font-size="26" font-weight="700" fill="#1E2A3A">What does it really cost?</text>
    <rect x="64" y="976" width="860" height="28" rx="14" fill="#1E2A3A" fill-opacity="0.08"/>
    <rect x="64" y="976" width="404" height="28" rx="14" fill="#2563EB"/>
    <text x="1136" y="1002" text-anchor="end" class="d" font-size="34" fill="#1E2A3A">47%</text>

    <text x="64" y="1052" font-size="26" font-weight="700" fill="#1E2A3A">Which one do I start with?</text>
    <rect x="64" y="1068" width="860" height="28" rx="14" fill="#1E2A3A" fill-opacity="0.08"/>
    <rect x="64" y="1068" width="353" height="28" rx="14" fill="#2563EB"/>
    <text x="1136" y="1094" text-anchor="end" class="d" font-size="34" fill="#1E2A3A">41%</text>

    <text x="64" y="1144" font-size="26" font-weight="700" fill="#1E2A3A">How long will it take to learn?</text>
    <rect x="64" y="1160" width="860" height="28" rx="14" fill="#1E2A3A" fill-opacity="0.08"/>
    <rect x="64" y="1160" width="249" height="28" rx="14" fill="#2563EB"/>
    <text x="1136" y="1186" text-anchor="end" class="d" font-size="34" fill="#1E2A3A">29%</text>
  </g>
  <!-- takeaway + CTA -->
  <line x1="64" y1="1212" x2="1136" y2="1212" stroke="#1E2A3A" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="64" y="1250" class="b" font-size="26" font-weight="700" fill="#1E2A3A">Privacy comes first. Then the trail.</text>
  <text x="64" y="1280" class="b" font-size="20" fill="#4A5668">Illustrative concept data, not a real survey.</text>
  <rect x="776" y="1218" width="360" height="64" rx="32" fill="#2563EB"/>
  <text x="956" y="1260" text-anchor="middle" class="b" font-size="26" font-weight="700" fill="#FFFFFF">Read the Field Guide</text>
</svg>
