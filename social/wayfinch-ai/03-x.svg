    <circle cx="940" cy="380" r="30" fill="#2563EB"/><text x="940" y="390" text-anchor="middle" class="d" font-size="28" fill="#FDFBF4">3</text>
    <text x="988" y="370">Check</text><text x="988" y="398" font-weight="400" font-size="20">each claim</text>
