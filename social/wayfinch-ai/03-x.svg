<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Wayfinch AI announcement: new trail, summarize a long report in 6 steps">
  <title>New trail: summarize a long report in 6 steps</title>
