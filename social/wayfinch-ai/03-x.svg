    <tspan x="64" y="338">Summarize a</tspan>
    <tspan x="64" y="438">long report</tspan>
    <tspan x="64" y="538">in 6 steps.</tspan>
  </text>
  <text class="b" font-size="28" fill="#4A5668">
    <tspan x="64" y="608">A beginner route with Pebblequery:</tspan>
    <tspan x="64" y="646">upload, ask, check, cite, trim, share.</tspan>
  </text>
  <g transform="translate(64 770)">
