    <text x="988" y="600">Trim</text><text x="988" y="628" font-weight="400" font-size="20">to one page</text>
    <circle cx="1190" cy="730" r="30" fill="#F97316"/><text x="1190" y="740" text-anchor="middle" class="d" font-size="28" fill="#1E2A3A">6</text>
    <text x="1238" y="720">Share</text><text x="1238" y="748" font-weight="400" font-size="20">with your team</text>
