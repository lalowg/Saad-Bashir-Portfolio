<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Liftwright X announcement: 24/7 platforms, no excuses left">
  <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow:wght@400;600;800&amp;display=swap');
    .d{font-family:'Anton','Impact','Arial Narrow',sans-serif}
    .b{font-family:'Barlow','Arial',sans-serif}</style>
  <defs>
    <pattern id="hzV" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="48" height="48" fill="#0B0B0B"/><rect width="24" height="48" fill="#D7FF1F"/></pattern>
    <pattern id="dotsR" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="4" fill="#FF3B1F"/></pattern>
    <linearGradient id="fadeR" x1="0" y1="1" x2="0.6" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="mR"><rect x="900" y="380" width="700" height="520" fill="url(#fadeR)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="#0B0B0B"/>
  <rect x="900" y="380" width="700" height="520" fill="url(#dotsR)" mask="url(#mR)"/>
  <rect x="0" y="0" width="84" height="900" fill="url(#hzV)"/>
  <text class="d" x="1536" y="370" font-size="460" fill="#161616" text-anchor="end">24/7</text>

  <!-- logo -->
  <g transform="translate(140 46) scale(0.14)"><g transform="translate(66 -14) skewX(-12)">
    <polygon points="150,84 258,84 258,318 386,318 386,414 150,414" fill="#D7FF1F"/>
    <polygon points="284,84 334,84 334,286 284,286" fill="#FF3B1F"/>
    <polygon points="358,84 386,84 386,286 358,286" fill="#F5F5F0"/></g></g>
  <text class="d" x="216" y="102" font-size="48" fill="#F5F5F0" letter-spacing="1">LIFTWRIGHT</text>
  <polygon points="1300,64 1536,64 1526,112 1290,112" fill="#FF3B1F"/>
  <text class="d" x="1413" y="100" font-size="30" fill="#0B0B0B" text-anchor="middle" letter-spacing="3">NOW OPEN</text>

  <text class="b" x="146" y="210" font-size="34" font-weight="800" fill="#FF3B1F" letter-spacing="6">THE IRON ROOM · FLOOR 2</text>
  <text class="d" x="140" y="380" font-size="160" fill="#F5F5F0">24/7 PLATFORMS.</text>
  <text class="d" x="140" y="550" font-size="160" fill="#D7FF1F">NO EXCUSES LEFT.</text>

  <text class="b" x="146" y="630" font-size="32" font-weight="600" fill="#F5F5F0">8 lifting platforms. 16 racks. Calibrated plates.</text>
  <text class="b" x="146" y="672" font-size="32" font-weight="400" fill="#8A8A8A">Keycard access for members, around the clock.</text>
  <polygon points="158,724 640,724 628,804 146,804" fill="#D7FF1F"/>
  <text class="d" x="387" y="778" font-size="36" fill="#0B0B0B" text-anchor="middle" letter-spacing="2">BOOK YOUR INDUCTION →</text>

  <!-- barbell -->
  <g transform="translate(0 0)">
    <rect x="1010" y="716" width="526" height="14" fill="#8A8A8A"/>
    <rect x="1070" y="610" width="42" height="226" rx="6" fill="#D7FF1F"/>
    <rect x="1118" y="636" width="34" height="174" rx="6" fill="#FF3B1F"/>
    <rect x="1158" y="666" width="24" height="114" rx="5" fill="#F5F5F0"/>
    <rect x="1188" y="704" width="18" height="38" fill="#8A8A8A"/>
    <rect x="1440" y="610" width="42" height="226" rx="6" fill="#D7FF1F"/>
    <rect x="1400" y="636" width="34" height="174" rx="6" fill="#FF3B1F"/>
    <rect x="1370" y="666" width="24" height="114" rx="5" fill="#F5F5F0"/>
    <rect x="1346" y="704" width="18" height="38" fill="#8A8A8A"/>
    <rect x="1010" y="836" width="526" height="4" fill="#F5F5F0" opacity="0.4"/>
  </g>
</svg>
