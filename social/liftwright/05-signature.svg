<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Liftwright Instagram story infographic: The Big 5 lifts and coaching cues">
  <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow:wght@400;600;800&amp;display=swap');
    .d{font-family:'Anton','Impact','Arial Narrow',sans-serif}
    .b{font-family:'Barlow','Arial',sans-serif}</style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="5" fill="#D7FF1F"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect width="1080" height="420" fill="url(#fade)"/></mask>
    <pattern id="hz" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="48" height="48" fill="#0B0B0B"/><rect width="24" height="48" fill="#D7FF1F"/></pattern>
  </defs>
  <rect width="1080" height="1920" fill="#0B0B0B"/>
  <rect width="1080" height="420" fill="url(#dots)" mask="url(#m)"/>
  <polygon points="760,0 900,0 700,420 560,420" fill="#FF3B1F"/>
  <rect x="0" y="0" width="1080" height="28" fill="url(#hz)"/>
  <g transform="translate(64 80) scale(0.16)"><g transform="translate(66 -14) skewX(-12)">
    <polygon points="150,84 258,84 258,318 386,318 386,414 150,414" fill="#D7FF1F"/>
    <polygon points="284,84 334,84 334,286 284,286" fill="#FF3B1F"/>
    <polygon points="358,84 386,84 386,286 358,286" fill="#F5F5F0"/></g></g>
  <text class="d" x="150" y="144" font-size="56" fill="#F5F5F0" letter-spacing="1">LIFTWRIGHT</text>
  <text class="b" x="1016" y="136" font-size="22" font-weight="800" fill="#F5F5F0" text-anchor="end" letter-spacing="4">FIELD GUIDE</text>
  <text class="b" x="64" y="220" font-size="28" font-weight="800" fill="#D7FF1F" letter-spacing="6">SAVE THIS · TRAIN IT</text>
  <text class="d" x="58" y="410" font-size="180" fill="#F5F5F0">THE BIG 5</text>
  <g>
  
  <text class="d" x="64" y="626" font-size="190" fill="none" stroke="#D7FF1F" stroke-width="3">01</text>
  <text class="d" x="330" y="534" font-size="84" fill="#F5F5F0">BACK SQUAT</text>
  <polygon points="334,552 398,552 394,560 330,560" fill="#FF3B1F"/>
  <text class="b" x="330" y="600" font-size="30" font-weight="600" fill="#F5F5F0">Big breath, brace hard.</text>
  <text class="b" x="330" y="638" font-size="30" font-weight="400" fill="#8A8A8A">Sit down between the hips, drive up.</text>
  <rect x="64" y="670" width="952" height="3" fill="#2A2A2A"/>
</g><g>
  
  <text class="d" x="64" y="876" font-size="190" fill="none" stroke="#D7FF1F" stroke-width="3">02</text>
  <text class="d" x="330" y="784" font-size="84" fill="#F5F5F0">BENCH PRESS</text>
  <polygon points="334,802 398,802 394,810 330,810" fill="#FF3B1F"/>
  <text class="b" x="330" y="850" font-size="30" font-weight="600" fill="#F5F5F0">Shoulder blades pinned.</text>
  <text class="b" x="330" y="888" font-size="30" font-weight="400" fill="#8A8A8A">Touch low on the chest, press back.</text>
  <rect x="64" y="920" width="952" height="3" fill="#2A2A2A"/>
</g><g>
  <polygon points="40,936 1040,936 1040,1162 40,1162" fill="#161616"/>
  <text class="d" x="64" y="1126" font-size="190" fill="#D7FF1F" stroke="#D7FF1F" stroke-width="3">03</text>
  <text class="d" x="330" y="1034" font-size="84" fill="#F5F5F0">DEADLIFT</text>
  <polygon points="334,1052 398,1052 394,1060 330,1060" fill="#FF3B1F"/>
  <text class="b" x="330" y="1100" font-size="30" font-weight="600" fill="#F5F5F0">Bar over mid-foot.</text>
  <text class="b" x="330" y="1138" font-size="30" font-weight="400" fill="#8A8A8A">Push the floor away, lock out tall.</text>
  <rect x="64" y="1170" width="952" height="3" fill="#2A2A2A"/>
</g><g>
  
  <text class="d" x="64" y="1376" font-size="190" fill="none" stroke="#D7FF1F" stroke-width="3">04</text>
  <text class="d" x="330" y="1284" font-size="84" fill="#F5F5F0">OVERHEAD PRESS</text>
  <polygon points="334,1302 398,1302 394,1310 330,1310" fill="#FF3B1F"/>
  <text class="b" x="330" y="1350" font-size="30" font-weight="600" fill="#F5F5F0">Glutes tight, ribs down.</text>
  <text class="b" x="330" y="1388" font-size="30" font-weight="400" fill="#8A8A8A">Press past the face, finish stacked.</text>
  <rect x="64" y="1420" width="952" height="3" fill="#2A2A2A"/>
</g><g>
  
  <text class="d" x="64" y="1626" font-size="190" fill="none" stroke="#D7FF1F" stroke-width="3">05</text>
  <text class="d" x="330" y="1534" font-size="84" fill="#F5F5F0">BARBELL ROW</text>
  <polygon points="334,1552 398,1552 394,1560 330,1560" fill="#FF3B1F"/>
  <text class="b" x="330" y="1600" font-size="30" font-weight="600" fill="#F5F5F0">Hinge to about 45 degrees.</text>
  <text class="b" x="330" y="1638" font-size="30" font-weight="400" fill="#8A8A8A">Pull to the belly, control it down.</text>
  <rect x="64" y="1670" width="952" height="3" fill="#2A2A2A"/>
</g>
  <polygon points="78,1694 620,1694 606,1784 64,1784" fill="#D7FF1F"/>
  <text class="d" x="342" y="1754" font-size="40" fill="#0B0B0B" text-anchor="middle" letter-spacing="2">BOOK A TECHNIQUE SESSION</text>
  <text class="b" x="1016" y="1734" font-size="24" font-weight="600" fill="#F5F5F0" text-anchor="end">Swipe for</text>
  <text class="b" x="1016" y="1766" font-size="24" font-weight="600" fill="#F5F5F0" text-anchor="end">sets + reps →</text>
  <text class="b" x="64" y="1840" font-size="22" font-weight="400" fill="#8A8A8A">General coaching cues only. Learn new lifts with a qualified coach.</text>
</svg>