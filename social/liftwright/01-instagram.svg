<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Liftwright Instagram post: Earn every rep">
  <style>@import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow:wght@400;600;800&amp;display=swap');
    .d{font-family:'Anton','Impact','Arial Narrow',sans-serif}
    .b{font-family:'Barlow','Arial',sans-serif}</style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="5.5" fill="#D7FF1F"/></pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="htMask"><rect width="1080" height="1350" fill="#000"/><circle cx="860" cy="430" r="440" fill="url(#fade)"/></mask>
    <pattern id="hz" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="56" height="56" fill="#0B0B0B"/><rect width="28" height="56" fill="#D7FF1F"/></pattern>
  </defs>
  <rect width="1080" height="1350" fill="#0B0B0B"/>
  <rect width="1080" height="1350" fill="url(#dots)" mask="url(#htMask)"/>
  <polygon points="700,0 860,0 420,1350 260,1350" fill="#FF3B1F"/>
  <polygon points="900,0 930,0 490,1350 460,1350" fill="#F5F5F0" opacity="0.9"/>

  <!-- logo -->
  <g transform="translate(64 56) scale(0.16)"><g transform="translate(66 -14) skewX(-12)">
    <polygon points="150,84 258,84 258,318 386,318 386,414 150,414" fill="#D7FF1F"/>
    <polygon points="284,84 334,84 334,286 284,286" fill="#FF3B1F"/>
    <polygon points="358,84 386,84 386,286 358,286" fill="#F5F5F0"/></g></g>
  <text class="d" x="150" y="120" font-size="56" fill="#F5F5F0" letter-spacing="1">LIFTWRIGHT</text>
  <text class="b" x="1016" y="100" font-size="24" font-weight="800" fill="#F5F5F0" text-anchor="end" letter-spacing="4">VOL.01</text>
  <text class="b" x="1016" y="130" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="end" letter-spacing="4">STRENGTH BLOCK</text>

  <!-- headline -->
  <text class="d" x="58" y="500" font-size="300" fill="#F5F5F0">EARN</text>
  <text class="d" x="58" y="780" font-size="300" fill="#D7FF1F">EVERY</text>
  <text class="d" x="58" y="1060" font-size="300" fill="none" stroke="#F5F5F0" stroke-width="5">REP.</text>

  <!-- hazard tape -->
  <g transform="rotate(-4 540 1130)">
    <rect x="-60" y="1094" width="1200" height="72" fill="url(#hz)"/>
    <rect x="300" y="1104" width="480" height="52" fill="#0B0B0B"/>
    <text class="d" x="540" y="1143" font-size="34" fill="#D7FF1F" text-anchor="middle" letter-spacing="3">6-WEEK STRENGTH BLOCK</text>
  </g>

  <!-- copy + CTA -->
  <text class="b" x="64" y="1238" font-size="32" font-weight="600" fill="#F5F5F0">Six weeks. Four sessions a week.</text>
  <text class="b" x="64" y="1278" font-size="32" font-weight="400" fill="#8A8A8A">One coach in your corner.</text>
  <polygon points="690,1206 1016,1206 1004,1286 678,1286" fill="#D7FF1F"/>
  <text class="d" x="847" y="1260" font-size="30" fill="#0B0B0B" text-anchor="middle" letter-spacing="2">START · LINK IN BIO</text>
</svg>
