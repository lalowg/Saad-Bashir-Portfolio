<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Tillorbit X announcement: Split any bill in one tap with Orbit Split">
  <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
    .d{font-family:'Outfit',system-ui,sans-serif}.b{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B3DF5"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
    <radialGradient id="bp"><stop offset="0" stop-color="#5B3DF5" stop-opacity=".5"/><stop offset="1" stop-color="#5B3DF5" stop-opacity="0"/></radialGradient>
    <radialGradient id="bk"><stop offset="0" stop-color="#FF5FA2" stop-opacity=".45"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg"><stop offset="0" stop-color="#2EE6A8" stop-opacity=".45"/><stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/></radialGradient>
    <linearGradient id="tr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B3DF5" stop-opacity="0"/><stop offset="1" stop-color="#5B3DF5"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#140F2D" flood-opacity=".2"/></filter>
    <symbol id="mark" viewBox="-100 -100 200 200">
      <circle r="46" fill="url(#g1)"/><rect x="-22" y="-19" width="44" height="10" rx="5" fill="#F5F3FF"/><rect x="-5" y="-19" width="10" height="46" rx="5" fill="#F5F3FF"/>
      <ellipse rx="84" ry="31" fill="none" stroke="currentColor" stroke-width="7" transform="rotate(-24)" stroke-dasharray="240 30" stroke-linecap="round"/><circle cx="70" cy="-34" r="13" fill="#2EE6A8"/>
    </symbol>
  </defs>
  <rect width="1600" height="900" fill="#F5F3FF"/>
  <circle cx="1260" cy="450" r="540" fill="url(#bp)"/>
  <circle cx="1480" cy="120" r="320" fill="url(#bk)"/>
  <circle cx="1020" cy="820" r="300" fill="url(#bg)"/>

  <use href="#mark" xlink:href="#mark" x="68" y="52" width="88" height="88" color="#140F2D"/>
  <text class="d" x="160" y="110" font-size="40" font-weight="700" letter-spacing="-1" fill="#140F2D">tillorbit</text>

  <rect x="80" y="186" width="268" height="52" rx="26" fill="#140F2D"/>
  <circle cx="110" cy="212" r="8" fill="#2EE6A8"/>
  <text class="b" x="130" y="220" font-size="20" font-weight="700" letter-spacing="3" fill="#F5F3FF">NEW FEATURE</text>

  <text class="d" x="80" y="366" font-size="104" font-weight="800" letter-spacing="-3" fill="#140F2D"><tspan x="80">Split any bill</tspan><tspan x="80" dy="108" fill="#5B3DF5">in one tap.</tspan></text>
  <text class="b" x="80" y="552" font-size="30" fill="#4A4566"><tspan x="80">Orbit Split divides, requests and settles</tspan><tspan x="80" dy="44">shared costs before the check lands.</tspan></text>

  <rect x="80" y="650" width="320" height="84" rx="42" fill="#5B3DF5"/>
  <text class="d" x="240" y="702" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Try Orbit Split →</text>
  <text class="b" x="80" y="800" font-size="20" font-weight="600" fill="#4A4566">Rolling out to waitlist members · Oct 2026</text>

  <g transform="translate(1260 450) rotate(-16)">
    <ellipse rx="262" ry="112" fill="none" stroke="#5B3DF5" stroke-opacity=".45" stroke-width="3"/>
    <ellipse rx="190" ry="74" fill="none" stroke="#FF5FA2" stroke-opacity=".6" stroke-width="3" stroke-dasharray="8 12"/>
    <path d="M -262 0 A 262 112 0 0 1 -60 -109" fill="none" stroke="url(#tr)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g transform="translate(1260 450) rotate(5)" filter="url(#sh)">
    <rect x="-128" y="-176" width="256" height="352" rx="26" fill="#FFFFFF"/>
    <rect x="-128" y="-176" width="256" height="70" rx="26" fill="url(#g1)"/>
    <rect x="-128" y="-130" width="256" height="24" fill="#FF5FA2" fill-opacity="0"/>
    <text class="d" x="-100" y="-132" font-size="24" font-weight="700" fill="#FFFFFF">Luna Bistro</text>
    <rect x="-100" y="-80" width="130" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/><rect x="60" y="-80" width="40" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/>
    <rect x="-100" y="-56" width="100" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/><rect x="60" y="-56" width="40" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/>
    <rect x="-100" y="-32" width="150" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/><rect x="60" y="-32" width="40" height="12" rx="6" fill="#140F2D" fill-opacity=".18"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#140F2D" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 6"/>
    <text class="b" x="-100" y="40" font-size="18" font-weight="600" fill="#4A4566">Total</text>
    <text class="d" x="100" y="44" font-size="38" font-weight="800" fill="#140F2D" text-anchor="end">€96.00</text>
    <rect x="-100" y="76" width="200" height="72" rx="20" fill="#F5F3FF"/>
    <text class="b" x="-84" y="108" font-size="16" font-weight="600" fill="#4A4566">Each pays</text>
    <text class="d" x="-84" y="136" font-size="26" font-weight="800" fill="#5B3DF5">€32.00</text>
    <circle cx="74" cy="112" r="18" fill="#2EE6A8"/>
    <path d="M 66 112 l 6 6 l 11 -12" fill="none" stroke="#140F2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1260 450) rotate(-16)">
    <path d="M -262 0 A 262 112 0 0 0 262 0" fill="none" stroke="#5B3DF5" stroke-width="4"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="1017" cy="540" r="44" fill="#5B3DF5"/>
    <text class="d" x="1017" y="556" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle">J</text>
    <circle cx="1463" cy="334" r="44" fill="#FF5FA2"/>
    <text class="d" x="1463" y="350" font-size="40" font-weight="800" fill="#140F2D" text-anchor="middle">R</text>
    <circle cx="1413" cy="507" r="44" fill="#2EE6A8"/>
    <text class="d" x="1413" y="523" font-size="40" font-weight="800" fill="#140F2D" text-anchor="middle">S</text>
  </g>
  <g>
    <rect x="1340" y="566" width="146" height="44" rx="22" fill="#140F2D"/>
    <text class="b" x="1413" y="595" font-size="18" font-weight="700" fill="#F5F3FF" text-anchor="middle">€32 · paid</text>
  </g>
</svg>
