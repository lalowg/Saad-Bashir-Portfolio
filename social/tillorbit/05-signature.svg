<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Tillorbit infographic story: Anatomy of a tap, a payment in four orbits">
  <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
    .d{font-family:'Outfit',system-ui,sans-serif}.b{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B3DF5"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
    <radialGradient id="bp"><stop offset="0" stop-color="#5B3DF5" stop-opacity=".35"/><stop offset="1" stop-color="#5B3DF5" stop-opacity="0"/></radialGradient>
    <radialGradient id="bk"><stop offset="0" stop-color="#FF5FA2" stop-opacity=".35"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg"><stop offset="0" stop-color="#2EE6A8" stop-opacity=".35"/><stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#140F2D" flood-opacity=".14"/></filter>
    <symbol id="mark" viewBox="-100 -100 200 200">
      <circle r="46" fill="url(#g1)"/><rect x="-22" y="-19" width="44" height="10" rx="5" fill="#F5F3FF"/><rect x="-5" y="-19" width="10" height="46" rx="5" fill="#F5F3FF"/>
      <ellipse rx="84" ry="31" fill="none" stroke="currentColor" stroke-width="7" transform="rotate(-24)" stroke-dasharray="240 30" stroke-linecap="round"/><circle cx="70" cy="-34" r="13" fill="#2EE6A8"/>
    </symbol>
  </defs>
  <rect width="1080" height="1920" fill="#F5F3FF"/>
  <circle cx="540" cy="960" r="520" fill="url(#bp)"/>
  <circle cx="960" cy="260" r="380" fill="url(#bk)"/>
  <circle cx="100" cy="1500" r="360" fill="url(#bg)"/>

  <use href="#mark" xlink:href="#mark" x="56" y="82" width="96" height="96" color="#140F2D"/>
  <text class="d" x="150" y="144" font-size="44" font-weight="700" letter-spacing="-1" fill="#140F2D">tillorbit</text>
  <rect x="806" y="100" width="210" height="56" rx="28" fill="none" stroke="#140F2D" stroke-width="3"/>
  <text class="b" x="911" y="136" font-size="20" font-weight="700" letter-spacing="3" fill="#140F2D" text-anchor="middle">EXPLAINER</text>

  <text class="d" x="64" y="320" font-size="112" font-weight="800" letter-spacing="-3" fill="#140F2D"><tspan x="64">Anatomy</tspan><tspan x="64" dy="112" fill="#5B3DF5">of a tap.</tspan></text>
  <text class="b" x="64" y="516" font-size="32" fill="#4A4566"><tspan x="64">What happens in the moments after you</tspan><tspan x="64" dy="46">pay, told in four orbits.</tspan></text>

  <g fill="none" stroke-width="3">
    <circle cx="540" cy="960" r="340" stroke="#140F2D" stroke-opacity=".18"/>
    <circle cx="540" cy="960" r="260" stroke="#5B3DF5" stroke-opacity=".35" stroke-dasharray="12 12"/>
    <circle cx="540" cy="960" r="180" stroke="#FF5FA2" stroke-opacity=".45"/>
    <circle cx="540" cy="960" r="100" stroke="#2EE6A8" stroke-opacity=".7" stroke-dasharray="6 10"/>
  </g>
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M 523 862 A 100 100 0 0 1 627 910" stroke="#2EE6A8"/>
    <path d="M 424 1098 A 180 180 0 0 1 371 898" stroke="#FF5FA2"/>
    <path d="M 373 761 A 260 260 0 0 1 670 735" stroke="#5B3DF5"/>
    <path d="M 656 1279 A 340 340 0 0 1 280 1179" stroke="#140F2D" stroke-opacity=".7"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="540" cy="960" r="64" fill="url(#g1)"/>
  </g>
  <rect x="518" y="922" width="44" height="76" rx="10" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="540" cy="984" r="4" fill="#FFFFFF"/>

  <g class="d" font-size="30" font-weight="800" text-anchor="middle">
    <circle cx="627" cy="910" r="28" fill="#2EE6A8"/><text x="627" y="921" fill="#140F2D">1</text>
    <circle cx="371" cy="898" r="28" fill="#FF5FA2"/><text x="371" y="909" fill="#140F2D">2</text>
    <circle cx="670" cy="735" r="28" fill="#5B3DF5"/><text x="670" y="746" fill="#FFFFFF">3</text>
    <circle cx="280" cy="1179" r="28" fill="#140F2D"/><text x="280" y="1190" fill="#FFFFFF">4</text>
  </g>
  <g class="b" font-size="20" font-weight="700" letter-spacing="3" fill="#140F2D">
    <text x="668" y="904">TAP</text>
    <text x="330" y="905" text-anchor="end">VERIFY</text>
    <text x="712" y="728">ROUTE</text>
    <text x="238" y="1186" text-anchor="end">SETTLE</text>
  </g>
  <g transform="translate(700 1226)" filter="url(#sh)">
    <rect width="300" height="72" rx="36" fill="#FFFFFF"/>
    <circle cx="36" cy="36" r="18" fill="#2EE6A8"/>
    <path d="M 28 36 l 6 6 l 11 -12" fill="none" stroke="#140F2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="d" x="66" y="45" font-size="24" font-weight="600" fill="#140F2D">Oat latte · €4.20</text>
  </g>

  <g filter="url(#sh)">
    <rect x="64" y="1370" width="460" height="160" rx="28" fill="#FFFFFF"/>
    <rect x="556" y="1370" width="460" height="160" rx="28" fill="#FFFFFF"/>
    <rect x="64" y="1550" width="460" height="160" rx="28" fill="#FFFFFF"/>
    <rect x="556" y="1550" width="460" height="160" rx="28" fill="#FFFFFF"/>
  </g>
  <g class="d" font-size="24" font-weight="800" text-anchor="middle">
    <circle cx="112" cy="1418" r="22" fill="#2EE6A8"/><text x="112" y="1427" fill="#140F2D">1</text>
    <circle cx="604" cy="1418" r="22" fill="#FF5FA2"/><text x="604" y="1427" fill="#140F2D">2</text>
    <circle cx="112" cy="1598" r="22" fill="#5B3DF5"/><text x="112" y="1607" fill="#FFFFFF">3</text>
    <circle cx="604" cy="1598" r="22" fill="#140F2D"/><text x="604" y="1607" fill="#FFFFFF">4</text>
  </g>
  <g class="d" font-size="32" font-weight="700" fill="#140F2D">
    <text x="148" y="1429">Tap</text>
    <text x="640" y="1429">Verify</text>
    <text x="148" y="1609">Route</text>
    <text x="640" y="1609">Settle</text>
  </g>
  <g class="b" font-size="21" fill="#4A4566">
    <text x="92" y="1474"><tspan x="92">Your phone shares a one-time</tspan><tspan x="92" dy="28">token, never your card number.</tspan></text>
    <text x="584" y="1474"><tspan x="584">The card issuer checks the</tspan><tspan x="584" dy="28">token and approves or declines.</tspan></text>
    <text x="92" y="1654"><tspan x="92">The network relays the answer</tspan><tspan x="92" dy="28">back to the shop’s terminal.</tspan></text>
    <text x="584" y="1654"><tspan x="584">Funds reach the shop later,</tspan><tspan x="584" dy="28">usually in a daily batch.</tspan></text>
  </g>

  <text class="b" x="540" y="1792" font-size="20" font-weight="600" fill="#4A4566" text-anchor="middle">Educational, not financial advice · Fictional concept brand</text>
</svg>
